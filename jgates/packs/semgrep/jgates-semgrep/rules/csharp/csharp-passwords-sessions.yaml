# Password policy, password handling, client-controlled privilege, global authorization and one-time passwords for C#.
# Libraries covered: string Length checks on password-like values, DataAnnotations (StringLength, MinLength,
# MaxLength) and FluentValidation (MinimumLength, MaximumLength, Length) on password properties, ASP.NET Core
# Identity PasswordOptions, BCrypt.Net / PasswordHasher for password transformation, ASP.NET Core controller
# parameters and HttpRequest members for privilege fields, ASP.NET Core authorization policies and endpoint
# conventions, Otp.NET (Totp, VerificationWindow) for one-time passwords.
# Names like a password: password, passwd, pwd, passphrase, senha (matched case-insensitively).
rules:
  - id: jgates.csharp.password-min-length-below-8
    message: A password validator accepts passwords shorter than 8 characters. Require a minimum length of at least 8 (preferably 12 or more), for example with RequiredLength in the Identity password options or MinimumLength in the validator.
    severity: ERROR
    languages: [csharp]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.1"]
    pattern-either:
      - patterns:
          - pattern: $PW.Length < $N
          - metavariable-regex:
              metavariable: $N
              regex: '^[0-7]$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - patterns:
          - pattern: $PW.Length <= $N
          - metavariable-regex:
              metavariable: $N
              regex: '^[0-6]$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - patterns:
          - pattern: $O.Password.RequiredLength = $N
          - metavariable-regex:
              metavariable: $N
              regex: '^[0-7]$'
      - pattern-regex: 'RuleFor\(\s*\w+\s*=>\s*\w+\.\w*(?i:password|passwd|pwd|passphrase|senha)\w*\s*\)(\.\w+\([^()]*\))*\.MinimumLength\(\s*[0-7]\s*\)'
      - pattern-regex: 'RuleFor\(\s*\w+\s*=>\s*\w+\.\w*(?i:password|passwd|pwd|passphrase|senha)\w*\s*\)(\.\w+\([^()]*\))*\.Length\(\s*[0-7]\s*,'
      - pattern-regex: '\[StringLength\(\s*\d+\s*,\s*MinimumLength\s*=\s*[0-7]\s*\)\]\s*public\s+\S+\s+\w*(?i:password|passwd|pwd|passphrase|senha)\w*'
      - pattern-regex: '\[MinLength\(\s*[0-7]\s*\)\]\s*public\s+\S+\s+\w*(?i:password|passwd|pwd|passphrase|senha)\w*'

  - id: jgates.csharp.password-max-length-below-64
    message: A password validator rejects passwords longer than a literal limit under 64 characters. Allow a maximum of at least 64 so that passphrases are accepted, and cap it only to protect the hash function.
    severity: WARNING
    languages: [csharp]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.9"]
    pattern-either:
      - pattern-regex: '\[MaxLength\(\s*([1-9]|[1-5][0-9]|6[0-3])\s*\)\]\s*public\s+\S+\s+\w*(?i:password|passwd|pwd|passphrase|senha)\w*'
      - pattern-regex: 'RuleFor\(\s*\w+\s*=>\s*\w+\.\w*(?i:password|passwd|pwd|passphrase|senha)\w*\s*\)(\.\w+\([^()]*\))*\.MaximumLength\(\s*([1-9]|[1-5][0-9]|6[0-3])\s*\)'
      - pattern-regex: 'RuleFor\(\s*\w+\s*=>\s*\w+\.\w*(?i:password|passwd|pwd|passphrase|senha)\w*\s*\)(\.\w+\([^()]*\))*\.Length\(\s*\d+\s*,\s*([1-9]|[1-5][0-9]|6[0-3])\s*\)'
      - pattern-regex: '\[StringLength\(\s*([1-9]|[1-5][0-9]|6[0-3])\s*(,[^\]]*)?\)\]\s*public\s+\S+\s+\w*(?i:password|passwd|pwd|passphrase|senha)\w*'
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $PW.Length > $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^([1-9]|[1-5][0-9]|6[0-3])$'
              - patterns:
                  - pattern: $PW.Length >= $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^([1-9]|[1-5][0-9]|6[0-4])$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'

  - id: jgates.csharp.password-composition-rule
    message: A password policy demands character classes (upper case, digits or symbols), which pushes users to predictable passwords. Check the length and screen against known breached passwords instead.
    severity: INFO
    languages: [csharp]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.5"]
    patterns:
      - pattern: $O.Password.$OPT = true
      - metavariable-regex:
          metavariable: $OPT
          regex: '^(RequireDigit|RequireLowercase|RequireUppercase|RequireNonAlphanumeric)$'

  - id: jgates.csharp.password-transformed-before-verify
    message: A password is lower-cased, upper-cased or cut before it is hashed or compared, which changes what the user typed and shrinks the secret. Hash and compare the password exactly as received.
    severity: WARNING
    languages: [csharp]
    mode: taint
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.8"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $PW.ToLower()
              - pattern: $PW.ToLowerInvariant()
              - pattern: $PW.ToUpper()
              - pattern: $PW.ToUpperInvariant()
              - pattern: $PW.Substring(...)
              - pattern: $PW.Trim()
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
    pattern-sinks:
      - patterns:
          - pattern: BCrypt.Net.BCrypt.HashPassword($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: BCrypt.HashPassword($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: BCrypt.Net.BCrypt.Verify($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: BCrypt.Verify($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: $H.HashPassword($U, $X)
          - focus-metavariable: $X
      - patterns:
          - pattern: $H.VerifyHashedPassword($U, $HASH, $X)
          - focus-metavariable: $X
      - patterns:
          - pattern: new Rfc2898DeriveBytes($X, ...)
          - focus-metavariable: $X

  - id: jgates.csharp.client-controlled-privilege
    message: A role, admin flag or permission field is set from the incoming request, so a caller can choose its own privilege. Take the privilege from a server-side record or a fixed value, never from request data.
    severity: WARNING
    languages: [csharp]
    mode: taint
    metadata:
      category: authorization
      cwe: "CWE-639"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.3.1"]
    pattern-sources:
      - patterns:
          - pattern: $P
          - pattern-inside: |
              public $R $M(..., string $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $APP.MapPost(..., (..., string $P, ...) => {
                ...
              });
      - pattern: Request.Query[...]
      - pattern: Request.Form[...]
      - pattern: Request.Headers[...]
      - pattern: Request.RouteValues[...]
    pattern-sinks:
      - patterns:
          - pattern: $U.$F = $X
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(role|roles|isadmin|admin|isstaff|issuperuser|isowner|permission|permissions|accesslevel|usertype|scope|scopes)$'
      - patterns:
          - pattern: 'new $T { ..., $F = $X, ... }'
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(role|roles|isadmin|admin|isstaff|issuperuser|isowner|permission|permissions|accesslevel|usertype|scope|scopes)$'
      - patterns:
          - pattern: new Claim(ClaimTypes.Role, $X)
          - focus-metavariable: $X
      - patterns:
          - pattern: $UM.AddToRoleAsync($U, $X)
          - focus-metavariable: $X

  - id: jgates.csharp.permit-all-requests
    message: The framework's global authorization is set to allow every request, so any endpoint without its own check is open. Default to a policy that requires an authenticated user and open individual endpoints on purpose.
    severity: WARNING
    languages: [csharp]
    metadata:
      category: authorization
      cwe: "CWE-862"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.2.1"]
    pattern-either:
      - pattern: $O.FallbackPolicy = <... $B.RequireAssertion($C => true) ...>
      - pattern: $O.DefaultPolicy = <... $B.RequireAssertion($C => true) ...>
      - pattern: $O.AddFallbackPolicy(..., $B => $B.RequireAssertion($C => true))
      - pattern: $APP.MapControllers().AllowAnonymous()
      - pattern: $APP.MapDefaultControllerRoute().AllowAnonymous()
      - pattern: $APP.MapRazorPages().AllowAnonymous()

  - id: jgates.csharp.totp-window-too-wide
    message: A one-time password check uses a step longer than 30 seconds or accepts more than one step on each side, which widens the time an intercepted code stays valid. Use a 30 second step and a verification window of at most 1.
    severity: WARNING
    languages: [csharp]
    metadata:
      category: authentication
      cwe: "CWE-307"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.5.5"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: 'new Totp($K, step: $V, ...)'
              - metavariable-regex:
                  metavariable: $V
                  regex: '^(3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})$'
          - patterns:
              - pattern: new Totp($K, $V, ...)
              - metavariable-regex:
                  metavariable: $V
                  regex: '^(3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})$'
          - patterns:
              - pattern: 'new VerificationWindow(previous: $V, ...)'
              - metavariable-regex:
                  metavariable: $V
                  regex: '^([2-9]|[1-9][0-9]+)$'
          - patterns:
              - pattern: 'new VerificationWindow(..., future: $V)'
              - metavariable-regex:
                  metavariable: $V
                  regex: '^([2-9]|[1-9][0-9]+)$'
          - patterns:
              - pattern: new VerificationWindow($V, ...)
              - metavariable-regex:
                  metavariable: $V
                  regex: '^([2-9]|[1-9][0-9]+)$'
          - patterns:
              - pattern: new VerificationWindow($P, $V)
              - metavariable-regex:
                  metavariable: $V
                  regex: '^([2-9]|[1-9][0-9]+)$'

  - id: jgates.csharp.secret-question-present
    message: A field or property is named as a secret question or its answer, a recovery method the standard does not accept. Remove it and recover accounts with a one-time link or code sent to a verified address.
    severity: INFO
    languages: [csharp]
    metadata:
      category: authentication
      cwe: "CWE-640"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.4.2"]
    patterns:
      - pattern-either:
          - pattern: public $T $F { ... }
          - pattern: public $T $F;
          - pattern: $R.Form[$F]
      - metavariable-regex:
          metavariable: $F
          regex: '(?i)^"?(secret|security)_?(question|answer)s?"?$'
