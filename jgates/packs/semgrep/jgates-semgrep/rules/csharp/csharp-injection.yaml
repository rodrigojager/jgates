# Covers ADO.NET (SqlCommand, CommandText), Dapper extension methods and the Entity Framework Core raw SQL methods.
rules:
  - id: jgates.csharp.sql-string-building
    message: A SQL statement is built from a string concatenation or interpolation. Pass values as parameters instead.
    severity: ERROR
    languages: [csharp]
    metadata:
      category: injection
      cwe: "CWE-89"
      author: JGates
      subdimension: injection
    patterns:
      - pattern-either:
          - pattern: new SqlCommand($Q, ...)
          - pattern: $C.CommandText = $Q;
          - pattern: $C.Query($Q, ...)
          - pattern: $C.Query<$T>($Q, ...)
          - pattern: $C.QueryAsync<$T>($Q, ...)
          - pattern: $C.Execute($Q, ...)
          - pattern: $C.ExecuteAsync($Q, ...)
          - pattern: $C.FromSqlRaw($Q, ...)
          - pattern: $C.ExecuteSqlRaw($Q, ...)
      # A concatenation "a" + x + "b" nests as ("a" + x) + "b": the statement text is searched for a literal joined to a
      # value that is not a literal, at any depth, or for an interpolated string; joining two literals is not flagged.
      - metavariable-pattern:
          metavariable: $Q
          patterns:
            - pattern-either:
                - pattern: '"..." + $X'
                - pattern: $"...{$X}..."
            - pattern-not: '"..." + "..."'

  - id: jgates.csharp.os-command-injection
    message: A process is started from a value that is not a literal. Start a fixed program and pass arguments as separate items.
    severity: ERROR
    languages: [csharp]
    metadata:
      category: injection
      cwe: "CWE-78"
      author: JGates
      subdimension: injection
    patterns:
      - pattern-either:
          - pattern: Process.Start($F, ...)
          - pattern: new ProcessStartInfo($F, ...)
          - pattern: $P.FileName = $F;
          - pattern: $P.Arguments = "..." + $A;
          - pattern: $P.Arguments = $"...{$A}...";
      - pattern-not: Process.Start("...", ...)
      - pattern-not: new ProcessStartInfo("...", ...)
      - pattern-not: $P.FileName = "...";
