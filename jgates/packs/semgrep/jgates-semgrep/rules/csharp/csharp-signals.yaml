          - pattern-either:
              - pattern: using $M;
              - pattern: global using $M;
              - pattern: using static $M;
              - pattern: using $A = $M;
          - metavariable-regex:
              metavariable: $M
              regex: ^(tusdotnet|Microsoft\.AspNetCore\.WebUtilities)(\..*)?$
      - pattern: $R $F(..., IFormFile $X, ...) { ... }
      - pattern: $R $F(..., IFormFileCollection $X, ...) { ... }
      - pattern: $R $F(..., IBrowserFile $X, ...) { ... }
      - pattern: $R $F(..., HttpPostedFileBase $X, ...) { ... }
      - pattern: $R $F(..., HttpPostedFile $X, ...) { ... }
      - pattern: $R $F(..., List<IFormFile> $X, ...) { ... }
      - pattern: $R $F(..., IList<IFormFile> $X, ...) { ... }
      - pattern: $R $F(..., IEnumerable<IFormFile> $X, ...) { ... }
      - pattern: $R $F(..., IEnumerable<HttpPostedFileBase> $X, ...) { ... }
      - pattern: IFormFile $X
      - pattern: IFormFileCollection $X
      - pattern: $R.Form.Files
      - pattern: $R.Request.Form.Files
      - pattern: $R.Request.Files
      - pattern: new MultipartReader(...)
      - pattern: $R.ReadNextSectionAsync(...)
      - pattern: $F.SaveAs(...)

