# Signal rules of the C# front: which technologies a project uses (jgates.csharp.uses-<tag>).
# They are records of the scan, never findings: they feed the "not applicable" suggestions.
# Each rule matches the using directive of the namespaces that bring the technology into a C# project (plain, global,
# static and alias forms), or the typical call or type where the standard library needs no dependency. A using
# directive is syntax, so a comment or a string that only mentions a library does not match.
# The tag "latex" has no signal in C#: no library is common enough to list with confidence.
rules:
  - id: jgates.csharp.uses-graphql
    message: The project uses GraphQL.
    severity: INFO
    languages: [csharp]
    metadata:
      signal: graphql
      author: JGates
    patterns:
      - pattern-either:
          - pattern: using $M;
          - pattern: global using $M;
          - pattern: using static $M;
          - pattern: using $A = $M;
      - metavariable-regex:
          metavariable: $M
          regex: ^(HotChocolate|GraphQL|GraphQLParser|StrawberryShake|EntityGraphQL|ZeroQL|Octokit\.GraphQL|GraphQLinq|SAHB\.GraphQL\.Client|GreenDonut)(\..*)?$

