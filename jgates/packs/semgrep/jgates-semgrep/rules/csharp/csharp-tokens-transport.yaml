rules:
  - id: jgates.csharp.jwt-algorithm-not-restricted
    message: The accepted token algorithms include "none" or follow the token's own header, so the sender picks how the token is checked. Fix the list to the algorithms you issue, for example ValidAlgorithms = new[] { SecurityAlgorithms.RsaSha256 }.
    severity: ERROR
    languages: [csharp]
    metadata:
      category: authorization
      cwe: "CWE-327"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V9.1.2"]
    pattern-either:
      - pattern-regex: '(?i)ValidAlgorithms\s*=[^;]*(?:"none"|SecurityAlgorithms\.None\b)'
      - pattern-regex: 'ValidAlgorithms\s*=[^;]*\.Header\.Alg\b'
      - pattern-regex: '\bJwsAlgorithm\.none\b'

  - id: jgates.csharp.jwt-key-from-token-header
    message: The verification key is taken from a value the token's own header names (jku, x5u or an embedded jwk), so the sender chooses the key that verifies the token. Look the key up by key id in a set of keys the service already trusts.
    severity: WARNING
    languages: [csharp]
    metadata:
      category: authorization
      cwe: "CWE-347"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V9.1.3"]
    pattern-either:
      - pattern: $T.Header["jku"]
      - pattern: $T.Header["x5u"]
      - pattern: $T.Header["jwk"]
      - pattern: $T.Header.TryGetValue("jku", ...)
      - pattern: $T.Header.TryGetValue("x5u", ...)
      - pattern: $T.Header.TryGetValue("jwk", ...)

  - id: jgates.csharp.oauth-request-without-state
    message: An OAuth authorization URL is built with neither a state nor a code challenge, so the callback cannot be tied to the request that started it. Pass a random per-request state and a PKCE code challenge, and check both on return.
    severity: WARNING
    languages: [csharp]
    metadata:
      category: authorization
      cwe: "CWE-352"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V10.2.1"]
    pattern-either:
      - pattern-regex: '[$@]*"https?://(?:(?!state|code_challenge)[^"\n])*response_type=code(?:(?!state|code_challenge)[^"\n])*"(?![^;]*(?:state|code_challenge))'
      - patterns:
          - pattern: '$R.CreateAuthorizeUrl(..., responseType: "code", ...)'
          - pattern-not: '$R.CreateAuthorizeUrl(..., state: $S, ...)'
          - pattern-not: '$R.CreateAuthorizeUrl(..., codeChallenge: $S, ...)'

  - id: jgates.csharp.tls-old-protocol-version
    message: A TLS configuration allows SSL 2, SSL 3, TLS 1.0 or TLS 1.1, which are broken or deprecated. Use SslProtocols.Tls12 | SslProtocols.Tls13, or SslProtocols.None to let the operating system choose.
    severity: ERROR
    languages: [csharp]
    metadata:
      category: transport
      cwe: "CWE-326"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V12.1.1"]
    pattern-either:
      - pattern-regex: '\bSslProtocols\.(?:Ssl2|Ssl3|Tls|Tls11|Default)\b'
      - pattern-regex: '\bSecurityProtocolType\.(?:Ssl3|Tls|Tls11)\b'

  - id: jgates.csharp.tls-weak-cipher-suite
    message: A cipher suite list names null, export, RC4, DES or 3DES suites, which give no or broken protection. List only AEAD suites such as TLS_AES_256_GCM_SHA384 or ECDHE with AES-GCM, or leave the list to the platform.
    severity: WARNING
    languages: [csharp]
    metadata:
      category: transport
      cwe: "CWE-327"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V12.1.2"]
    pattern-regex: '\bTlsCipherSuite\.\w*(?:RC4|3DES|DES_CBC|_NULL_|EXPORT)\w*'

  - id: jgates.csharp.cleartext-http-url
    message: A network client is given a plain HTTP or FTP address that is not the local machine, so the request travels without encryption. Use an HTTPS address.
    severity: INFO
    languages: [csharp]
    metadata:
      category: transport
      cwe: "CWE-319"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V12.2.1", "V12.3.1", "V12.3.3"]
    patterns:
      - pattern-either:
          - pattern: $C.GetAsync($U, ...)
          - pattern: $C.GetStringAsync($U, ...)
          - pattern: $C.GetStreamAsync($U, ...)
          - pattern: $C.GetByteArrayAsync($U, ...)
          - pattern: $C.PostAsync($U, ...)
          - pattern: $C.PutAsync($U, ...)
          - pattern: $C.DeleteAsync($U, ...)
          - pattern: $C.PostAsJsonAsync($U, ...)
          - pattern: $C.GetFromJsonAsync($U, ...)
          - pattern: new HttpRequestMessage($M, $U)
          - pattern: WebRequest.Create($U)
          - pattern: HttpWebRequest.Create($U)
          - pattern: $W.DownloadString($U, ...)
          - pattern: $W.DownloadFile($U, ...)
          - pattern: $W.DownloadData($U, ...)
          - pattern: $W.UploadString($U, ...)
          - pattern: $C.BaseAddress = new Uri($U)
      - metavariable-regex:
          metavariable: $U
          regex: ^[$@]*"\s*(?i:http|ftp)://(?!(?:localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)(?![\w.-]))

  - id: jgates.csharp.mtls-client-certificate-not-verified
    message: A TLS server asks for a client certificate and a callback accepts every one, so mutual TLS authenticates nobody. Return the result of a real check, for example errors == SslPolicyErrors.None, and chain the certificate to a trusted CA.
    severity: ERROR
    languages: [csharp]
    metadata:
      category: transport
      cwe: "CWE-295"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V12.1.3"]
    pattern-either:
      - pattern-regex: 'ClientCertificateValidation\s*=\s*(?:\([^)]*\)|\w+)\s*=>\s*true\b'
      - pattern-regex: 'ClientCertificateRequired\s*=\s*true[^;]*?RemoteCertificateValidationCallback\s*=\s*(?:\([^)]*\)|\w+)\s*=>\s*true\b'
      - pattern-regex: 'RemoteCertificateValidationCallback\s*=\s*(?:\([^)]*\)|\w+)\s*=>\s*true\b[^;]*?ClientCertificateRequired\s*=\s*true'
