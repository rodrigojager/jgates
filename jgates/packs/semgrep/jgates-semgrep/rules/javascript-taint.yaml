rules:
  - id: jgates.js.ssrf
    message: A request URL comes from the incoming request. Validate the host against an allow-list before fetching.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    metadata:
      category: ssrf
      cwe: "CWE-918"
      author: JGates
      subdimension: injection
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sanitizers:
      - pattern: validateUrl(...)
    pattern-sinks:
      - patterns:
          - pattern: fetch($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: axios.$M($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: axios($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: http.get($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: got($URL, ...)
          - focus-metavariable: $URL

  - id: jgates.js.path-traversal
    message: A file path comes from the incoming request. Reduce it with path.basename and check it stays under the intended folder.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    metadata:
      category: path-traversal
      cwe: "CWE-22"
      author: JGates
      subdimension: injection
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sanitizers:
      - pattern: path.basename(...)
    pattern-sinks:
      - patterns:
          - pattern: fs.readFile($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: fs.readFileSync($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: fs.createReadStream($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: fs.writeFile($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: fs.unlink($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: $RES.sendFile($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: path.join($BASE, $P, ...)
          - focus-metavariable: $P
