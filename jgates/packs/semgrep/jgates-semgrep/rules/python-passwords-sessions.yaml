# Python rules of the group passwords-sessions: password policy, a global allow-all authorization switch,
# one-time password windows and secret questions.
# Frameworks and libraries covered: Django (settings, forms, models), Django REST framework, WTForms,
# marshmallow, pydantic, bcrypt, hashlib, werkzeug, passlib, pyotp, django-otp.
rules:
  - id: jgates.python.password-min-length-below-8
    message: A password field accepts fewer than 8 characters. Require a minimum length of at least 8 (15 where the password is the only factor).
    severity: ERROR
    languages: [python]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.1"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: Length(..., min=$N, ...)
              - pattern: $M.Length(..., min=$N, ...)
          - pattern-inside: PasswordField(...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 8
      - patterns:
          - pattern-either:
              - pattern: $F = $M.CharField(..., min_length=$N, ...)
              - pattern: $F = Field(..., min_length=$N, ...)
              - pattern: "$F: $T = Field(..., min_length=$N, ...)"
              - pattern: "$F: constr(..., min_length=$N, ...)"
              - pattern: $F = $M.$T(..., validate=$V.Length(..., min=$N, ...), ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(password|passwd|pwd|passphrase|senha).*
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 8
      - patterns:
          - pattern-either:
              - pattern: '{..., "NAME": "django.contrib.auth.password_validation.MinimumLengthValidator", ..., "OPTIONS": {..., "min_length": $N, ...}, ...}'
              - pattern: MinimumLengthValidator(..., min_length=$N, ...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 8

  - id: jgates.python.password-max-length-below-64
    message: A password field rejects passwords shorter than 64 characters at the top end. Allow at least 64 characters so passphrases fit.
    severity: WARNING
    languages: [python]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.9"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: Length(..., max=$N, ...)
              - pattern: $M.Length(..., max=$N, ...)
          - pattern-inside: PasswordField(...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 64
      - patterns:
          - pattern-either:
              - pattern: $F = $M.CharField(..., max_length=$N, ...)
              - pattern: $F = Field(..., max_length=$N, ...)
              - pattern: "$F: $T = Field(..., max_length=$N, ...)"
              - pattern: "$F: constr(..., max_length=$N, ...)"
              - pattern: $F = $M.$T(..., validate=$V.Length(..., max=$N, ...), ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(password|passwd|pwd|passphrase|senha).*
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 64

  - id: jgates.python.password-composition-rule
    message: A password policy demands character classes through a pattern. Check length and breached-password lists instead of forced upper, lower, digit or symbol rules.
    severity: INFO
    languages: [python]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.5"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: re.$F($S, $P, ...)
              - pattern: re.$F($S, $P.$M, ...)
          - metavariable-regex:
              metavariable: $P
              regex: (?i).*(password|passwd|pwd|passphrase|senha).*
          - metavariable-regex:
              metavariable: $S
              regex: (?s).*\(\?=\.\*.*
      - patterns:
          - pattern-either:
              - pattern: Regexp($S, ...)
              - pattern: $M.Regexp($S, ...)
          - pattern-inside: PasswordField(...)
          - metavariable-regex:
              metavariable: $S
              regex: (?s).*\(\?=\.\*.*

  - id: jgates.python.password-transformed-before-verify
    message: A password is lower-cased, upper-cased or cut before it is hashed or compared, which shrinks the set of valid passwords. Hash and verify the exact value the user typed.
    severity: WARNING
    languages: [python]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.8"]
    patterns:
      - pattern-either:
          - pattern: $P.lower()
          - pattern: $P.upper()
          - pattern: $P.casefold()
          - pattern: "$P[:$N]"
          - pattern: "$P[$A:$B]"
      - metavariable-regex:
          metavariable: $P
          regex: (?i).*(password|passwd|pwd|passphrase|senha).*
      - pattern-either:
          - pattern-inside: bcrypt.$M(...)
          - pattern-inside: hashlib.$M(...)
          - pattern-inside: make_password(...)
          - pattern-inside: check_password(...)
          - pattern-inside: generate_password_hash(...)
          - pattern-inside: check_password_hash(...)
          - pattern-inside: $CTX.hash(...)
          - pattern-inside: $CTX.verify(...)
  - id: jgates.python.permit-all-requests
    message: The framework's global permission setting allows every request, so any view without its own check is open. Default to an authenticated permission class and open individual views on purpose.
    severity: WARNING
    languages: [python]
    metadata:
      category: authorization
      cwe: "CWE-862"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.2.1"]
    pattern-either:
      - pattern: '{..., "DEFAULT_PERMISSION_CLASSES": [..., "rest_framework.permissions.AllowAny", ...], ...}'
      - pattern: '{..., "DEFAULT_PERMISSION_CLASSES": [..., AllowAny, ...], ...}'
      - pattern: '{..., "DEFAULT_PERMISSION_CLASSES": (..., "rest_framework.permissions.AllowAny", ...), ...}'
      - pattern: 'REST_FRAMEWORK["DEFAULT_PERMISSION_CLASSES"] = [..., "rest_framework.permissions.AllowAny", ...]'
      - pattern: 'REST_FRAMEWORK["DEFAULT_PERMISSION_CLASSES"] = [..., AllowAny, ...]'

  - id: jgates.python.totp-window-too-wide
    message: A one-time password is accepted over a step longer than 30 seconds or a window wider than one step on each side, which gives an attacker more time to guess or replay. Keep the 30-second step and a window of at most 1.
    severity: WARNING
    languages: [python]
    metadata:
      category: authentication
      cwe: "CWE-307"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.5.5"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: pyotp.TOTP(..., interval=$N, ...)
              - pattern: TOTPDevice(..., step=$N, ...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N > 30
      - patterns:
          - pattern-either:
              - pattern: $T.verify(..., valid_window=$N, ...)
              - pattern: TOTPDevice(..., tolerance=$N, ...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N > 1

  - id: jgates.python.secret-question-present
    message: A model or form carries a secret question and its answer. Knowledge-based recovery is guessable; recover accounts with a one-time link or code sent to a verified channel.
    severity: INFO
    languages: [python]
    metadata:
      category: authentication
      cwe: "CWE-640"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.4.2"]
    patterns:
      - pattern-inside: |
          class $C(...):
              ...
      - pattern-either:
          - pattern: $F = $V
          - pattern: "$F: $T"
          - pattern: "$F: $T = $V"
      - metavariable-regex:
          metavariable: $F
          regex: (?i)^(secret|security)_?(question|answer)s?$
