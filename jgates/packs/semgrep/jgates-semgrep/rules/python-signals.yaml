# Signal rules of the Python front: which technologies a project uses (jgates.python.uses-<tag>).
# They are records of the scan, never findings: they feed the "not applicable" suggestions.
# Each rule matches the import of the libraries that bring the technology into a Python project (any import
# statement, at any depth of the file), or the typical call where the standard library needs no dependency.
# Imports are syntax, so a comment or a string that only mentions a library does not match.
rules:
  - id: jgates.python.uses-graphql
    message: The project uses GraphQL.
    severity: INFO
    languages: [python]
    metadata:
      signal: graphql
      author: JGates
    patterns:
      - pattern-either:
          - pattern: import $M
          - pattern: from $M import $X
          - pattern: from $M import *
      - metavariable-regex:
          metavariable: $M
          regex: ^(graphene|graphene_django|graphene_sqlalchemy|graphene_pydantic|graphql|graphql_core|graphql_server|graphql_relay|graphql_ws|strawberry|ariadne|ariadne_django|gql|sgqlc|tartiflette|flask_graphql|flask_graphql_auth|graphql_jwt|django_graphql_jwt|django_graphene|promise|aiodataloader|graphql_api|starlette_graphene3|starlette_graphene|sanic_graphql|aiohttp_graphql|python_graphql_client|ratelimit_graphql|gql_ws|hasura)(\..*)?$

  - id: jgates.python.uses-websocket
    message: The project uses WebSocket.
    severity: INFO
    languages: [python]
    metadata:
      signal: websocket
      author: JGates
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import $M
              - pattern: from $M import $X
              - pattern: from $M import *
          - metavariable-regex:
              metavariable: $M
              regex: ^(websockets|websocket|channels|channels_redis|daphne|flask_socketio|flask_sock|socketio|engineio|python_socketio|simple_websocket|tornado\.websocket|starlette\.websockets|fastapi\.websockets|autobahn|wsproto|geventwebsocket|gevent_websocket|aiohttp_sse|websocket_client|django_channels|ws4py|wsaccel|sanic\.websocket|quart\.websocket|pywebsocket|flask_uwsgi_websocket|django_websocket_redis|ws_stream|tornado_websocket|websockify|channels_graphql_ws|fastapi_websocket_pubsub|fastapi_websocket_rpc|starlette_websocket)(\..*)?$
      - pattern: from fastapi import WebSocket
      - pattern: from starlette import websockets
      - pattern: from quart import websocket
      - pattern: from sanic import Websocket
      - pattern: fastapi.WebSocket
      - pattern: $W.WebSocketResponse(...)
      - pattern: $S.ws_connect(...)
      - pattern: |
          @$A.websocket(...)
          def $F(...):
            ...
      - pattern: |
          @$A.websocket(...)
          async def $F(...):
            ...
      - pattern: |
          @$A.websocket_route(...)
          def $F(...):
            ...
      - pattern: |
          @$A.websocket_route(...)
          async def $F(...):
            ...

