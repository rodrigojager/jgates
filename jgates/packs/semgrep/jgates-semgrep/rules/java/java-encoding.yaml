  - id: jgates.java.double-decoding
    message: A value is URL-, HTML- or base64-decoded and then decoded again with the same decoder, so encoded input can slip past checks made after the first decode. Decode once and validate the result.
    severity: WARNING
    languages: [java]
    metadata:
      category: injection
      cwe: "CWE-174"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.1.1"]
    pattern-either:
      - pattern: URLDecoder.decode(URLDecoder.decode($X, ...), ...)
      - pattern: |
          String $A = URLDecoder.decode($X, ...);
          ...
          String $B = URLDecoder.decode($A, ...);
      - pattern: StringEscapeUtils.unescapeHtml4(StringEscapeUtils.unescapeHtml4($X))
      - pattern: HtmlUtils.htmlUnescape(HtmlUtils.htmlUnescape($X))
      - pattern: |
          String $A = HtmlUtils.htmlUnescape($X);
          ...
          String $B = HtmlUtils.htmlUnescape($A);
      - pattern: Base64.getDecoder().decode(new String(Base64.getDecoder().decode($X)))
      - pattern: |
          String $A = new String(Base64.getDecoder().decode($X));
          ...
          byte[] $B = Base64.getDecoder().decode($A);

