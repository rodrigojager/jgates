                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestHeader(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestHeader $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @QueryParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @PathParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @FormParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @HeaderParam(...) $T $P, ...) {
                ...
              }
    pattern-sanitizers:
      - pattern: Pattern.quote(...)
    pattern-sinks:
      - patterns:
          - pattern: Pattern.compile($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: Pattern.matches($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: (String $S).matches($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: (String $S).replaceAll($P, $R)
          - focus-metavariable: $P
      - patterns:
          - pattern: (String $S).replaceFirst($P, $R)
          - focus-metavariable: $P
      - patterns:
          - pattern: (String $S).split($P, ...)
          - focus-metavariable: $P

  - id: jgates.java.redos-nested-quantifier
    message: This regular expression has a quantified group that itself ends in a quantifier, such as (x+)+. A crafted input makes the match time grow exponentially. Rewrite the group so the repeats cannot overlap, for example x+ alone.
    severity: WARNING
    languages: [java]
    metadata:
      category: injection
      cwe: "CWE-1333"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.3.12"]
    patterns:
      - pattern-either:
          - pattern: Pattern.compile($S, ...)
          - pattern: Pattern.matches($S, ...)
          - pattern: (String $X).matches($S)
          - pattern: (String $X).replaceAll($S, $R)
          - pattern: (String $X).replaceFirst($S, $R)
          - pattern: (String $X).split($S, ...)
      - metavariable-regex:
          metavariable: $S
          regex: '(?s)^.*\([^()]*[^\\()][+*]\??\)([+*]|\{\d+,\d*\}).*$'

