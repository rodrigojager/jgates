# Encoding rules for Java. Request sources: HttpServletRequest getters (parameters, headers, query string, path info,
# request URI), Spring MVC parameters annotated @RequestParam, @PathVariable, @RequestBody or @RequestHeader, and JAX-RS
# parameters annotated @QueryParam, @PathParam, @FormParam or @HeaderParam, as in java-taint.yaml. Sinks: java.util.regex
# and String regex methods, String.format and printf-style calls, MessageFormat, Commons CSV, OpenCSV and POI cells,
# spymemcached and XMemcached calls, URL and JSON string building; plus the double-decoding and Markdown rules.
# The analysis stays inside one method.
rules:
  - id: jgates.java.regex-from-request
    message: Request data is compiled or matched as a regular expression. Wrap it in Pattern.quote before it becomes part of a pattern.
    severity: WARNING
    languages: [java]
    mode: taint
    metadata:
      category: injection
      cwe: "CWE-1333"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.2.9", "V1.3.12"]
    pattern-sources:
      - pattern: (HttpServletRequest $REQ).getParameter(...)
      - pattern: (HttpServletRequest $REQ).getHeader(...)
      - pattern: (HttpServletRequest $REQ).getQueryString(...)
      - pattern: (HttpServletRequest $REQ).getPathInfo(...)
      - pattern: (HttpServletRequest $REQ).getRequestURI(...)
      - pattern: (HttpServletRequest $REQ).getParameterValues(...)
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
