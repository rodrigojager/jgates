# Sources named by these rules: HttpServletRequest getters (parameters, headers, query string, path info, request
# URI), Spring MVC parameters annotated @RequestParam, @PathVariable, @RequestBody or @RequestHeader, and JAX-RS
# parameters annotated @QueryParam, @PathParam, @FormParam or @HeaderParam. The analysis stays inside one method.
rules:
  - id: jgates.java.ssrf
    message: A request URL comes from the incoming request. Validate the host against an allow-list before fetching.
    severity: ERROR
    languages: [java]
    mode: taint
    metadata:
      category: ssrf
      cwe: "CWE-918"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.3.6"]
    pattern-sources:
      - pattern: (HttpServletRequest $REQ).getParameter(...)
      - pattern: (HttpServletRequest $REQ).getHeader(...)
      - pattern: (HttpServletRequest $REQ).getQueryString(...)
      - pattern: (HttpServletRequest $REQ).getPathInfo(...)
      - pattern: (HttpServletRequest $REQ).getRequestURI(...)
      - pattern: (HttpServletRequest $REQ).getParameterValues(...)
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestParam $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @PathVariable(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @PathVariable $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestBody(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestBody $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestHeader(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestHeader $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @QueryParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @PathParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @FormParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @HeaderParam(...) $T $P, ...) {
                ...
              }
    pattern-sanitizers:
      - pattern: validateUrl(...)
    pattern-sinks:
      - patterns:
          - pattern: new URL($U)
          - focus-metavariable: $U
      - patterns:
          - pattern: new URI($U)
          - focus-metavariable: $U
      - patterns:
          - pattern: URI.create($U)
          - focus-metavariable: $U
      - patterns:
          - pattern: new HttpGet($U)
          - focus-metavariable: $U
      - patterns:
          - pattern: new HttpPost($U)
          - focus-metavariable: $U
      - patterns:
          - pattern: (RestTemplate $RT).getForObject($U, ...)
          - focus-metavariable: $U
      - patterns:
          - pattern: (RestTemplate $RT).getForEntity($U, ...)
          - focus-metavariable: $U
      - patterns:
          - pattern: (RestTemplate $RT).postForObject($U, ...)
          - focus-metavariable: $U
      - patterns:
          - pattern: (RestTemplate $RT).postForEntity($U, ...)
          - focus-metavariable: $U
      - patterns:
          - pattern: (RestTemplate $RT).exchange($U, ...)
          - focus-metavariable: $U

