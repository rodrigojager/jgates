          - pattern-inside: |
              $RET $M(..., @PathVariable $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestBody(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestBody $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestHeader(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestHeader $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @QueryParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @PathParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @FormParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @HeaderParam(...) $T $P, ...) {
                ...
              }
    pattern-sanitizers:
      - pattern: HtmlUtils.htmlEscape(...)
      - pattern: StringEscapeUtils.escapeHtml4(...)
      - pattern: Encode.forHtml(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $R.getWriter().println($U)
              - pattern: $R.getWriter().print($U)
              - pattern: $R.getWriter().write($U)
              - pattern: $R.getWriter().append($U)
          - pattern-inside: |
              $RET $M(..., HttpServletResponse $R, ...) {
                ...
              }
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: $OUT.println($U)
              - pattern: $OUT.print($U)
              - pattern: $OUT.write($U)
              - pattern: $OUT.append($U)
          - pattern-inside: |
              PrintWriter $OUT = $R.getWriter();
              ...
          - focus-metavariable: $U
      - patterns:
          - pattern: return $U;
          - pattern-inside: |
              @GetMapping(..., produces = "text/html", ...)
              $RET $M(...) {
                ...
              }
      - patterns:
          - pattern: return $U;
          - pattern-inside: |
              @PostMapping(..., produces = "text/html", ...)
              $RET $M(...) {
                ...
              }
      - patterns:
          - pattern: return $U;
          - pattern-inside: |
              @RequestMapping(..., produces = "text/html", ...)
              $RET $M(...) {
                ...
              }
      - patterns:
          - pattern: ResponseEntity.ok().contentType(MediaType.TEXT_HTML).body($U)
          - focus-metavariable: $U

