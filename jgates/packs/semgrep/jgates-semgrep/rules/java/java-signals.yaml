# Signal rules of the Java front: which technologies a project uses (jgates.java.uses-<tag>).
# They are records of the scan, never findings: they feed the "not applicable" suggestions.
# Each rule matches the import of the libraries that bring the technology into a Java project (plain, wildcard and
# static imports), or the typical call where the standard library needs no dependency. Imports are syntax, so a
# comment or a string that only mentions a library does not match. The tag "latex" has no signal in Java: no library
# is common enough to list with confidence.
rules:
  - id: jgates.java.uses-graphql
    message: The project uses GraphQL.
    severity: INFO
    languages: [java]
    metadata:
      signal: graphql
      author: JGates
    patterns:
      - pattern-either:
          - pattern: import $M;
          - pattern: import static $M;
      - metavariable-regex:
          metavariable: $M
          regex: ^(graphql|com\.netflix\.graphql|com\.apollographql|io\.leangen\.graphql|com\.graphql_java_generator|org\.springframework\.graphql|com\.expediagroup\.graphql|io\.smallrye\.graphql|org\.eclipse\.microprofile\.graphql|com\.kobylynskyi\.graphql|com\.coxautodev\.graphql|com\.introproventures\.graphql)(\..*)?$

