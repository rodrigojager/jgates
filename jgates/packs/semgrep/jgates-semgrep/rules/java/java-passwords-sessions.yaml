# Password policy, password handling, session renewal, client-controlled privilege, global authorization and one-time
# passwords for Java.
# Libraries covered: Bean Validation (@Size) and Hibernate Validator (@Length, @Pattern) on password fields, String
# length checks on password-like values, Passay (LengthRule, CharacterRule), Spring Security PasswordEncoder and
# jBCrypt for password transformation, the Servlet HttpSession and HttpServletRequest API for session renewal, Spring
# MVC and JAX-RS parameters and HttpServletRequest getters for privilege fields, Spring Security HttpSecurity and
# WebSecurity authorization, java-otp (TimeBasedOneTimePasswordGenerator), samstevens totp (DefaultCodeVerifier) and
# GoogleAuth (GoogleAuthenticatorConfigBuilder) for one-time passwords.
# Names like a password: password, passwd, pwd, passphrase, senha (matched case-insensitively).
rules:
  - id: jgates.java.password-min-length-below-8
    message: A password validator accepts passwords shorter than 8 characters. Require a minimum length of at least 8 (preferably 12 or more), for example @Size(min = 12) on the field or new LengthRule(12, 128) in Passay.
    severity: ERROR
    languages: [java]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.1"]
    pattern-either:
      - patterns:
          - pattern: $PW.length() < $N
          - metavariable-regex:
              metavariable: $N
              regex: '^[0-7]$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - patterns:
          - pattern: $PW.length() <= $N
          - metavariable-regex:
              metavariable: $N
              regex: '^[0-6]$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - patterns:
          - pattern: new LengthRule($N, $M)
          - metavariable-regex:
              metavariable: $N
              regex: '^[0-7]$'
      - pattern-regex: '@(?:Size|Length)\([^)]*?\bmin\s*=\s*[0-7](?!\d)[^)]*\)\s*(?:@\w+(?:\([^)]*\))?\s*)*(?:(?:private|public|protected)\s+)?(?:final\s+)?\w+(?:<[^>]*>)?\s+\w*(?i:password|passwd|pwd|passphrase|senha)\w*\s*[;=,)]'

  - id: jgates.java.password-max-length-below-64
    message: A password validator rejects passwords longer than a literal limit under 64 characters. Allow a maximum of at least 64 so that passphrases are accepted, and cap it only to protect the hash function.
    severity: WARNING
    languages: [java]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.9"]
    pattern-either:
      - patterns:
          - pattern: $PW.length() > $N
          - metavariable-regex:
              metavariable: $N
              regex: '^([1-9]|[1-5][0-9]|6[0-3])$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - patterns:
          - pattern: $PW.length() >= $N
          - metavariable-regex:
              metavariable: $N
              regex: '^([1-9]|[1-5][0-9]|6[0-4])$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - patterns:
          - pattern: new LengthRule($N, $M)
          - metavariable-regex:
              metavariable: $M
              regex: '^([1-9]|[1-5][0-9]|6[0-3])$'
      - pattern-regex: '@(?:Size|Length)\([^)]*?\bmax\s*=\s*(?:[1-9]|[1-5][0-9]|6[0-3])(?!\d)[^)]*\)\s*(?:@\w+(?:\([^)]*\))?\s*)*(?:(?:private|public|protected)\s+)?(?:final\s+)?\w+(?:<[^>]*>)?\s+\w*(?i:password|passwd|pwd|passphrase|senha)\w*\s*[;=,)]'

  - id: jgates.java.password-composition-rule
    message: A password policy demands character classes (upper case, digits or symbols), which pushes users to predictable passwords. Check the length and screen against known breached passwords instead.
    severity: INFO
    languages: [java]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.5"]
    pattern-either:
      - pattern: new CharacterRule(...)
      - pattern-regex: '@Pattern\([^)]*?regexp\s*=\s*"[^"]*\(\?=[^"]*"[^)]*\)\s*(?:@\w+(?:\([^)]*\))?\s*)*(?:(?:private|public|protected)\s+)?(?:final\s+)?\w+(?:<[^>]*>)?\s+\w*(?i:password|passwd|pwd|passphrase|senha)\w*\s*[;=,)]'

  - id: jgates.java.password-transformed-before-verify
    message: A password is lower-cased, upper-cased or cut before it is hashed or compared, which changes what the user typed and shrinks the secret. Hash and compare the password exactly as received.
    severity: WARNING
    languages: [java]
    mode: taint
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.8"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $PW.toLowerCase(...)
              - pattern: $PW.toUpperCase(...)
              - pattern: $PW.substring(...)
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
    pattern-sinks:
      - patterns:
          - pattern: $ENC.encode($X)
          - focus-metavariable: $X
      - patterns:
          - pattern: $ENC.matches($X, $H)
          - focus-metavariable: $X
      - patterns:
          - pattern: BCrypt.hashpw($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: BCrypt.checkpw($X, ...)
          - focus-metavariable: $X

  - id: jgates.java.session-id-not-regenerated
    message: A login stores the identity in the HTTP session without renewing the session identifier first, so an identifier planted before login stays valid afterwards (session fixation). Call request.changeSessionId() (or invalidate the old session and create a new one) before storing the identity.
    severity: WARNING
    languages: [java]
    metadata:
      category: session
      cwe: "CWE-384"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V7.2.4"]
    patterns:
      - pattern-either:
          - pattern: $REQ.getSession(...).setAttribute($K, $V)
          - pattern: (HttpSession $S).setAttribute($K, $V)
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)^"[^"]*(user|principal|auth|login|account|identity)[^"]*"$'
      - pattern-inside: |
          $T $M(...) {
            ...
          }
      - pattern-not-inside: |
          $T $M(...) {
            ...
            $R.changeSessionId();
            ...
          }
      - pattern-not-inside: |
          $T $M(...) {
            ...
            $O.invalidate();
            ...
          }
      - pattern-not-inside: |
          $T $M(...) {
            ...
            if (...) {
              ...
              $O.invalidate();
              ...
            }
            ...
          }

  - id: jgates.java.client-controlled-privilege
    message: A role, admin flag or permission field is set from the incoming request, so a caller can choose its own privilege. Take the privilege from a server-side record or a fixed value, never from request data.
    severity: WARNING
    languages: [java]
    mode: taint
    metadata:
      category: authorization
      cwe: "CWE-639"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.3.1"]
    pattern-sources:
      - pattern: (HttpServletRequest $REQ).getParameter(...)
      - pattern: (HttpServletRequest $REQ).getHeader(...)
      - pattern: (HttpServletRequest $REQ).getQueryString(...)
      - pattern: (HttpServletRequest $REQ).getPathInfo(...)
      - pattern: (HttpServletRequest $REQ).getRequestURI(...)
      - pattern: (HttpServletRequest $REQ).getParameterValues(...)
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestParam $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @PathVariable(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @PathVariable $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestHeader(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @RequestHeader $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @QueryParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @FormParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @PathParam(...) $T $P, ...) {
                ...
              }
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $RET $M(..., @HeaderParam(...) $T $P, ...) {
                ...
              }
    pattern-sinks:
      - patterns:
          - pattern: $U.$F($X)
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $F
              regex: '^(set|add)(Role|Roles|Admin|IsAdmin|Superuser|SuperUser|Permission|Permissions|AccessLevel|UserType|Authorities|Authority|Privilege|Privileges)$'
      - patterns:
          - pattern: new SimpleGrantedAuthority($X)
          - focus-metavariable: $X

  - id: jgates.java.permit-all-requests
    message: The framework's global authorization is set to allow every request, so any endpoint without its own check is open. Default to anyRequest().authenticated() and open individual paths on purpose.
    severity: WARNING
    languages: [java]
    metadata:
      category: authorization
      cwe: "CWE-862"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.2.1"]
    pattern-either:
      - pattern: $X.anyRequest().permitAll()
      - pattern: $X.requestMatchers("/**").permitAll()
      - pattern: $X.antMatchers("/**").permitAll()
      - pattern: $X.mvcMatchers("/**").permitAll()
      - pattern: $W.ignoring().anyRequest()

  - id: jgates.java.totp-window-too-wide
    message: A one-time password check uses a step longer than 30 seconds or accepts more than one step on each side, which widens the time an intercepted code stays valid. Use a 30 second step and a window of at most one step either side.
    severity: WARNING
    languages: [java]
    metadata:
      category: authentication
      cwe: "CWE-307"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.5.5"]
    pattern-either:
      - patterns:
          - pattern: $B.setTimeStepSizeInMillis($V)
          - metavariable-regex:
              metavariable: $V
              regex: '^(3[1-9][0-9]{3}|30[1-9][0-9]{2}|300[1-9][0-9]|3000[1-9]|[4-9][0-9]{4}|[1-9][0-9]{5,})[lL]?$'
      - patterns:
          - pattern: $B.setWindowSize($V)
          - metavariable-regex:
              metavariable: $V
              regex: '^([4-9]|[1-9][0-9]+)$'
      - patterns:
          - pattern: $B.setAllowedTimePeriodDiscrepancy($V)
          - metavariable-regex:
              metavariable: $V
              regex: '^([2-9]|[1-9][0-9]+)$'
      - patterns:
          - pattern: new TimeBasedOneTimePasswordGenerator(Duration.ofSeconds($V), ...)
          - metavariable-regex:
              metavariable: $V
              regex: '^(3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})[lL]?$'

  - id: jgates.java.secret-question-present
    message: A field is named as a secret question or its answer, a recovery method the standard does not accept. Remove it and recover accounts with a one-time link or code sent to a verified address.
    severity: INFO
    languages: [java]
    metadata:
      category: authentication
      cwe: "CWE-640"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.4.2"]
    patterns:
      - pattern-either:
          - pattern: private $T $F;
          - pattern: protected $T $F;
          - pattern: public $T $F;
          - pattern: (HttpServletRequest $R).getParameter($F)
      - metavariable-regex:
          metavariable: $F
          regex: '(?i)^"?(secret|security)_?(question|answer)s?"?$'
