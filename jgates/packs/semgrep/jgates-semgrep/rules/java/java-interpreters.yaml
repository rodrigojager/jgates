# Interpreters other than SQL and the shell. Sources named by the taint rules: HttpServletRequest getters (parameters,
# headers, query string, path info, request URI), Spring MVC parameters annotated @RequestParam, @PathVariable,
# @RequestBody or @RequestHeader, and JAX-RS parameters annotated @QueryParam, @PathParam, @FormParam or @HeaderParam.
# Sinks: JNDI and Spring LDAP searches, javax.xml.xpath and dom4j XPath, Velocity, FreeMarker, Handlebars, Pebble,
# Jinjava and Mustache template compilation, JAXP stylesheets. Non-literal rules cover script engines, SpEL, OGNL,
# MVEL, Groovy, BeanShell, JEXL, javax.el and JNDI lookups, and the LaTeX shell-escape switches. The analysis stays
# inside one method.
rules:
  - id: jgates.java.ldap-injection
