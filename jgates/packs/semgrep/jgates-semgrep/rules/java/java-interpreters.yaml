  - id: jgates.java.latex-shell-escape
    message: A LaTeX program is started with the shell-escape or write18 switch, so a document can run commands. Compile without it (the default is restricted) and keep input out of the document source.
    severity: ERROR
    languages: [java]
    metadata:
      category: injection
      cwe: "CWE-78"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.2.8"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: new ProcessBuilder(..., $F, ...)
              - pattern: new String[] {..., $F, ...}
              - pattern: List.of(..., $F, ...)
              - pattern: Arrays.asList(..., $F, ...)
              - pattern: $PB.command(..., $F, ...)
          - metavariable-regex:
              metavariable: $F
              regex: '^"--?(shell-escape|enable-write18)"$'
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($C, ...)
              - pattern: new ProcessBuilder($C, ...)
          - metavariable-regex:
              metavariable: $C
              regex: '^"[^"]*tex[^"]*\s--?(shell-escape|enable-write18)(\s[^"]*)?"$'
