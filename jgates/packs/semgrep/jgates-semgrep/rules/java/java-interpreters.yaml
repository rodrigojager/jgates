    pattern-sanitizers:
      - pattern: LdapEncoder.filterEncode(...)
      - pattern: LdapEncoder.nameEncode(...)
      - pattern: Rdn.escapeValue(...)
      - pattern: Encode.forLdap(...)
      - pattern: Encode.forLdapDn(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (DirContext $C).search($N, $F, ...)
              - pattern: (InitialDirContext $C).search($N, $F, ...)
              - pattern: (LdapContext $C).search($N, $F, ...)
              - pattern: (InitialLdapContext $C).search($N, $F, ...)
          - focus-metavariable: $F
      - patterns:
          - pattern-either:
              - pattern: (DirContext $C).search($N, $F, ...)
              - pattern: (InitialDirContext $C).search($N, $F, ...)
              - pattern: (LdapContext $C).search($N, $F, ...)
              - pattern: (InitialLdapContext $C).search($N, $F, ...)
          - focus-metavariable: $N
      - patterns:
          - pattern-either:
              - pattern: (LdapTemplate $T).search($B, $F, ...)
              - pattern: (LdapTemplate $T).searchForObject($B, $F, ...)
              - pattern: (LdapTemplate $T).authenticate($B, $F, ...)
          - focus-metavariable: $F
      - patterns:
          - pattern-either:
              - pattern: (LdapTemplate $T).search($B, $F, $X, ...)
              - pattern: (LdapTemplate $T).searchForObject($B, $F, $X, ...)
              - pattern: (LdapTemplate $T).authenticate($B, $F, $X, ...)
          - focus-metavariable: $B
      - patterns:
          - pattern: LdapQueryBuilder.query().filter($F)
          - focus-metavariable: $F
      - patterns:
          - pattern: new LdapName($N)
          - focus-metavariable: $N

