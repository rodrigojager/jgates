  - id: jgates.java.dynamic-code-execution
    message: A script engine or expression language evaluates text that is not a literal. Use a fixed expression with bound variables, or a restricted evaluation context such as SimpleEvaluationContext.
    severity: ERROR
    languages: [java]
    metadata:
      category: injection
      cwe: "CWE-95"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.3.2"]
    patterns:
      - pattern-either:
          - pattern: (ScriptEngine $E).eval($X, ...)
          - pattern: new ScriptEngineManager().getEngineByName(...).eval($X, ...)
          - pattern: (ExpressionParser $P).parseExpression($X, ...)
          - pattern: (SpelExpressionParser $P).parseExpression($X, ...)
          - pattern: new SpelExpressionParser().parseExpression($X, ...)
          - pattern: Ognl.parseExpression($X)
          - pattern: Ognl.getValue((String $X), ...)
          - pattern: Ognl.setValue((String $X), ...)
          - pattern: MVEL.eval($X, ...)
          - pattern: MVEL.compileExpression($X, ...)
          - pattern: (GroovyShell $G).evaluate($X, ...)
          - pattern: new GroovyShell(...).evaluate($X, ...)
          - pattern: (GroovyShell $G).parse($X, ...)
          - pattern: (Interpreter $I).eval($X)
          - pattern: (JexlEngine $J).createExpression($X)
          - pattern: (JexlEngine $J).createScript($X, ...)
          - pattern: (ExpressionFactory $F).createValueExpression($C, $X, ...)
      # Not a single literal, a concatenation of literals or a constant (an upper-case name such as SCRIPT or Scripts.SUM).
      - metavariable-regex:
          metavariable: $X
          regex: '^(?!"[^"]*"(?:\s*\+\s*"[^"]*")*$)(?!(?:\w+\.)*[A-Z][A-Z0-9_]*$)'

  - id: jgates.java.jndi-lookup-from-request
    message: A JNDI lookup uses a name that is not a literal, so a caller can point it at a remote object. Look up a fixed name such as java:comp/env/jdbc/app.
    severity: ERROR
    languages: [java]
    metadata:
      category: injection
      cwe: "CWE-74"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.3.8"]
    patterns:
      - pattern-either:
          - pattern: (Context $C).lookup($X)
          - pattern: (InitialContext $C).lookup($X)
          - pattern: (DirContext $C).lookup($X)
          - pattern: (InitialDirContext $C).lookup($X)
          - pattern: (LdapContext $C).lookup($X)
          - pattern: new InitialContext().lookup($X)
          - pattern: (JndiTemplate $C).lookup($X, ...)
          - pattern: new JndiTemplate().lookup($X, ...)
      - metavariable-regex:
          metavariable: $X
          regex: '^(?!"[^"]*"(?:\s*\+\s*"[^"]*")*$)(?!(?:\w+\.)*[A-Z][A-Z0-9_]*$)'

