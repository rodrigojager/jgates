    severity: INFO
    languages: [go]
    metadata:
      signal: archives
      author: JGates
    patterns:
      - pattern: import "$M"
      - metavariable-regex:
          metavariable: $M
          regex: ^"?(archive/zip|archive/tar|compress/gzip|compress/bzip2|compress/zlib|compress/flate|compress/lzw|github\.com/(mholt/archiver|mholt/archives|ulikunitz/xz|klauspost/compress|klauspost/pgzip|bodgit/sevenzip|nwaples/rardecode|yeka/zip|pierrec/lz4|dsnet/compress|andybalholm/brotli|DataDog/zstd|valyala/gozstd|golang/snappy|saracen/fastzip|alexmullins/zip|gen2brain/go-unarr|codeclysm/extract|artdarek/go-unzip|hashicorp/go-extract|hashicorp/go-getter|blakesmith/ar|cavaliergopher/cpio)|gopkg\.in/mholt/archiver\.v[0-9]+|gopkg\.in/ulikunitz/xz\.v[0-9]+|gopkg\.in/pierrec/lz4\.v[0-9]+|gopkg\.in/alexmullins/zip\.v[0-9]+)(/.*)?"?$

