      - pattern: import "$M"
      - metavariable-regex:
          metavariable: $M
          regex: ^"?(html/template|text/template|github\.com/(flosch/pongo2|aymerick/raymond|cbroglie/mustache|hoisie/mustache|a-h/templ|valyala/quicktemplate|osteele/liquid|gofiber/template|yosssi/ace|eknkc/amber|CloudyKit/jet|kataras/blocks|unrolled/render|gobuffalo/plush|gin-contrib/multitemplate|Masterminds/sprig|nikolalohinski/gonja|noirbizarre/gonja|go-sprout/sprout|thedevsaddam/renderer|kataras/iris/v[0-9]+/view|kataras/iris/view|go-macaron/pongo2|Joker/jade)|gopkg\.in/flosch/pongo2\.v[0-9]+|gopkg\.in/yosssi/ace\.v[0-9]+|gopkg\.in/unrolled/render\.v[0-9]+)(/.*)?"?$

  - id: jgates.go.uses-file-upload
    message: The project accepts file uploads.
    severity: INFO
    languages: [go]
    metadata:
      signal: file-upload
      author: JGates
    pattern-either:
      - patterns:
          - pattern: import "$M"
          - metavariable-regex:
              metavariable: $M
              regex: ^"?(mime/multipart|github\.com/(tus/tusd|tus/tusd/v[0-9]+|h2non/filetype))(/.*)?"?$
      - pattern: $R.FormFile(...)
      - pattern: $R.ParseMultipartForm(...)
      - pattern: $R.MultipartReader()
      - pattern: $C.SaveUploadedFile(...)
      - pattern: $C.MultipartForm()

  - id: jgates.go.uses-archives
