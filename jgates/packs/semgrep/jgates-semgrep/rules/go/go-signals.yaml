      - metavariable-regex:
          metavariable: $M
          regex: ^"?(golang\.org/x/oauth2|gopkg\.in/oauth2\.v[0-9]+|github\.com/(coreos/go-oidc|zitadel/oidc|markbates/goth|dghubble/oauth1|dghubble/gologin|int128/oauth2cli|AzureAD/microsoft-authentication-library-for-go|okta/okta-jwt-verifier-golang|mrjones/oauth|garyburd/go-oauth|oauth2-proxy/oauth2-proxy|Nerzal/gocloak))(/.*)?"?$

