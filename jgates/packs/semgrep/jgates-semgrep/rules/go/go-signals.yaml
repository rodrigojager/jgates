# Signal rules of the Go front: which technologies a project uses (jgates.go.uses-<tag>).
# They are records of the scan, never findings: they feed the "not applicable" suggestions.
# Each rule matches the import of the libraries that bring the technology into a Go project, or the typical call
# where the standard library needs no dependency. Imports are syntax, so a comment or a string that only mentions
# a library does not match. The tag "latex" has no signal in Go: no library is common enough to list with confidence.
rules:
  - id: jgates.go.uses-graphql
    message: The project uses GraphQL.
    severity: INFO
    languages: [go]
    metadata:
      signal: graphql
      author: JGates
    patterns:
      - pattern: import "$M"
      - metavariable-regex:
          metavariable: $M
          regex: ^"?(github\.com/(graphql-go/[^"]*|99designs/gqlgen|vektah/gqlparser|graph-gophers/graphql-go|machinebox/graphql|hasura/go-graphql-client|shurcooL/graphql|shurcooL/githubv4|Yamashou/gqlgenc|samsarahq/thunder|appleboy/gin-graphql|dosco/graphjin|arsmn/fastgql|nautilus/[^"]*)|entgo\.io/contrib/entgql)(/.*)?"?$

  - id: jgates.go.uses-websocket
    message: The project uses WebSocket.
    severity: INFO
    languages: [go]
    metadata:
      signal: websocket
      author: JGates
    patterns:
      - pattern: import "$M"
      - metavariable-regex:
          metavariable: $M
          regex: ^"?(github\.com/(gorilla/websocket|coder/websocket|gobwas/ws|olahol/melody|googollee/go-socket\.io|googollee/go-engine\.io|fasthttp/websocket|gofiber/websocket|gofiber/contrib/websocket|centrifugal/centrifuge|centrifugal/centrifuge-go|lesismal/nbio|lxzan/gws|igm/sockjs-go|sacOO7/gowebsocket|recws-org/recws|zishang520/socket\.io[^"]*)|nhooyr\.io/websocket|golang\.org/x/net/websocket|gopkg\.in/olahol/melody\.v[0-9]+)(/.*)?"?$

