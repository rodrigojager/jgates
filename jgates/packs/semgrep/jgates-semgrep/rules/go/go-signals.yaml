    message: The project uses WebRTC.
    severity: INFO
    languages: [go]
    metadata:
      signal: webrtc
      author: JGates
    patterns:
      - pattern: import "$M"
      - metavariable-regex:
          metavariable: $M
          regex: ^"?(github\.com/(pion/[^"]*|livekit/server-sdk-go|livekit/server-sdk-go/v[0-9]+|livekit/protocol|livekit/livekit-server|AlexxIT/go2rtc|jech/galene|keroserene/go-webrtc|notedit/janus-go))(/.*)?"?$

  - id: jgates.go.uses-oauth-client
    message: The project uses OAuth 2.0 or OpenID Connect as a client.
    severity: INFO
