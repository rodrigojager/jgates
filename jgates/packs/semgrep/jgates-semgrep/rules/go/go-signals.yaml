    severity: INFO
    languages: [go]
    metadata:
      signal: oauth-authorization-server
      author: JGates
    patterns:
      - pattern: import "$M"
      - metavariable-regex:
          metavariable: $M
          regex: ^"?(github\.com/(ory/fosite|ory/hydra|go-oauth2/oauth2|go-oauth2/gin-server|RangelReale/osin|openshift/osin|dexidp/dex|zitadel/zitadel|luikyv/go-oidc)|gopkg\.in/oauth2\.v[0-9]+/server|gopkg\.in/oauth2\.v[0-9]+/manage|gopkg\.in/oauth2\.v[0-9]+/store|gopkg\.in/oauth2\.v[0-9]+/generates)(/.*)?"?$

