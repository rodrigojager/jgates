          regex: ^"?(net/smtp|net/mail|golang\.org/x/net/smtp|github\.com/(go-gomail/gomail|go-mail/mail|go-mail/gomail|wneessen/go-mail|jordan-wright/email|sendgrid/sendgrid-go|mailgun/mailgun-go|mailjet/mailjet-apiv3-go|keighl/postmark|mrz1836/postmark|mattbaird/gochimp|aws/aws-sdk-go/service/ses|aws/aws-sdk-go/service/sesv2|aws/aws-sdk-go-v2/service/ses|aws/aws-sdk-go-v2/service/sesv2|resend/resend-go|emersion/go-smtp|emersion/go-imap|emersion/go-message|emersion/go-sasl|emersion/go-pop3|domodwyer/mailyak|xhit/go-simple-mail|matcornic/hermes|jhillyerd/enmime|mhale/smtpd|flashmob/go-guerrilla|knadh/smtppool|scorredoira/email|veqryn/go-email|mailersend/mailersend-go|getbrevo/brevo-go|sendinblue/APIv3-go-library|SparkPost/gosparkpost|ainsleyclark/go-mail|appleboy/gomail|bytbox/go-pop3)|gopkg\.in/gomail\.v[0-9]+|gopkg\.in/mail\.v[0-9]+|google\.golang\.org/api/gmail/v[0-9]+)(/.*)?"?$

