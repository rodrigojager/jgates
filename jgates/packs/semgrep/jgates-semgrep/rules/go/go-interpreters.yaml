                    ...
                  }
          - pattern-either:
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.URL.Query().Get(...)
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.Header.Get(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.DefaultQuery(...)
              - pattern: $R.PostForm(...)
              - pattern: $R.DefaultPostForm(...)
              - pattern: $R.Param(...)
              - pattern: $R.GetHeader(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.QueryParam(...)
              - pattern: $R.Param(...)
              - pattern: $R.FormValue(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.Params(...)
              - pattern: $R.FormValue(...)
      - pattern: chi.URLParam($R, ...)
    pattern-sanitizers:
      - pattern: mime.QEncoding.Encode(...)
      - pattern: mime.BEncoding.Encode(...)
    pattern-sinks:
      - patterns:
          - pattern: $H + $X
          - metavariable-regex:
              metavariable: $H
              regex: '(?i)^"(.*\\n)?\s*(to|cc|bcc|from|subject|reply-to|sender)\s*:[^\\]*"$'
          - focus-metavariable: $X
      - patterns:
          - pattern: fmt.Sprintf($FMT, $X)
          - metavariable-regex:
              metavariable: $FMT
              regex: '(?i)^["`]\s*(to|cc|bcc|from|subject|reply-to|sender)\s*:[^\\%]*%[sv]\s*(\\r)?(\\n)?["`]$'
          - focus-metavariable: $X

  - id: jgates.go.latex-shell-escape
    message: A LaTeX program is started with the shell-escape (write18) switch, which lets the document run commands. Compile without it, or with -no-shell-escape.
    severity: ERROR
    languages: [go]
    metadata:
      category: injection
      cwe: "CWE-78"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.2.8"]
    patterns:
      - pattern-either:
          - pattern: exec.Command($P, ..., "-shell-escape", ...)
          - pattern: exec.Command($P, ..., "--shell-escape", ...)
          - pattern: exec.Command($P, ..., "-enable-write18", ...)
          - pattern: exec.Command($P, ..., "--enable-write18", ...)
          - pattern: exec.CommandContext($C, $P, ..., "-shell-escape", ...)
          - pattern: exec.CommandContext($C, $P, ..., "--shell-escape", ...)
          - pattern: exec.CommandContext($C, $P, ..., "-enable-write18", ...)
          - pattern: exec.CommandContext($C, $P, ..., "--enable-write18", ...)
      - metavariable-regex:
          metavariable: $P
          regex: '(?i)^"([^"]*[/\\])?(pdflatex|xelatex|lualatex|latexmk|pdftex|xetex|luatex|tex|latex|context)(\.exe)?"$'
