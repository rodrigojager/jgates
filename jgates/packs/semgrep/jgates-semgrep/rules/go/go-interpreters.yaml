# Go rules for the interpreters group: injection into interpreters other than SQL and the shell.
# Sources: net/http, gin, echo, fiber and chi request data (as in go-taint.yaml).
# Sinks: go-ldap searches, antchfx/xmlquery/htmlquery/go-xmlpath XPath, text/template and html/template
# sources, os/exec LaTeX programs with shell escape, text-built mail headers.

rules:
  - id: jgates.go.ldap-injection
    message: Request data is joined into an LDAP filter or base DN passed to a search. Escape each value with ldap.EscapeFilter (filters) or ldap.EscapeDN (DNs) before building the string.
    severity: ERROR
    languages: [go]
    mode: taint
    metadata:
      category: injection
      cwe: "CWE-90"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.2.6"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *http.Request, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.URL.Query().Get(...)
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.Header.Get(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.DefaultQuery(...)
              - pattern: $R.PostForm(...)
              - pattern: $R.DefaultPostForm(...)
              - pattern: $R.Param(...)
              - pattern: $R.GetHeader(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.QueryParam(...)
              - pattern: $R.Param(...)
              - pattern: $R.FormValue(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.Params(...)
              - pattern: $R.FormValue(...)
      - pattern: chi.URLParam($R, ...)
    pattern-sanitizers:
      - pattern: ldap.EscapeFilter(...)
      - pattern: ldap.EscapeDN(...)
    pattern-sinks:
      - patterns:
          - pattern: ldap.NewSearchRequest($BASE, $S, $D, $SZ, $T, $TY, $F, ...)
          - focus-metavariable: $F
      - patterns:
          - pattern: ldap.NewSearchRequest($BASE, $S, $D, $SZ, $T, $TY, $F, ...)
          - focus-metavariable: $BASE

