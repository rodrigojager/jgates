rules:
  - id: jgates.go.unsafe-deserialization
    message: Request data is decoded with encoding/gob. Decode a plain data format such as JSON into a fixed struct instead.
    severity: ERROR
    languages: [go]
    mode: taint
    metadata:
      category: deserialization
      cwe: "CWE-502"
      author: JGates
      subdimension: injection
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *http.Request, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.URL.Query().Get(...)
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.Header.Get(...)
              - pattern: $R.Body
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.DefaultQuery(...)
              - pattern: $R.PostForm(...)
              - pattern: $R.DefaultPostForm(...)
              - pattern: $R.Param(...)
              - pattern: $R.GetHeader(...)
              - pattern: $R.GetRawData()
              - pattern: $R.Request.Body
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.QueryParam(...)
              - pattern: $R.Param(...)
              - pattern: $R.FormValue(...)
              - pattern: $R.Request().Body
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.Params(...)
              - pattern: $R.FormValue(...)
              - pattern: $R.Body()
      - pattern: chi.URLParam($R, ...)
    pattern-sanitizers:
      - pattern: validateBlob(...)
    pattern-sinks:
      - patterns:
          - pattern: gob.NewDecoder($P)
          - focus-metavariable: $P
