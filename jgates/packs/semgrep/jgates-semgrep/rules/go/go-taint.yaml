    severity: ERROR
    languages: [go]
    mode: taint
    metadata:
      category: path-traversal
      cwe: "CWE-22"
      author: JGates
      subdimension: injection
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) {
                    ...
