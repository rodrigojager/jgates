              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *http.Request, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.URL.Query().Get(...)
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.Header.Get(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.DefaultQuery(...)
              - pattern: $R.PostForm(...)
              - pattern: $R.DefaultPostForm(...)
              - pattern: $R.Param(...)
              - pattern: $R.GetHeader(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.QueryParam(...)
              - pattern: $R.Param(...)
              - pattern: $R.FormValue(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.Params(...)
              - pattern: $R.FormValue(...)
      - pattern: chi.URLParam($R, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
    pattern-sinks:
      - patterns:
          - pattern: os.Open($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.OpenFile($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.ReadFile($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.Create($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.WriteFile($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.Remove($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.RemoveAll($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: ioutil.ReadFile($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: http.ServeFile($W, $R2, $P)
          - focus-metavariable: $P
