# Password policy, password handling, client-controlled privilege and one-time passwords for Go.
# Libraries covered: standard library length checks (len, utf8.RuneCountInString) on password-like values,
# go-playground/validator and gin binding struct tags, ozzo-validation (validation.Length), bcrypt / argon2 /
# scrypt / pbkdf2 and crypto/subtle for password transformation, net/http, gin, echo and fiber request
# data for privilege fields, pquerna/otp (totp.ValidateOpts, totp.GenerateOpts) for one-time passwords.
# Names like a password: password, passwd, pwd, passphrase, senha (matched case-insensitively).
rules:
  - id: jgates.go.password-min-length-below-8
    message: A password validator accepts passwords shorter than 8 characters. Require a minimum length of at least 8 (preferably 12 or more) and check it with the validator's minimum, not a smaller literal.
    severity: ERROR
    languages: [go]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.1"]
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: len($PW) < $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^[0-7]$'
              - patterns:
                  - pattern: len($PW) <= $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^[0-6]$'
              - patterns:
                  - pattern: utf8.RuneCountInString($PW) < $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^[0-7]$'
              - patterns:
                  - pattern: utf8.RuneCountInString($PW) <= $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^[0-6]$'
              - patterns:
                  - pattern: validation.Field(&$S.$PW, ..., validation.Length($MIN, $MAX), ...)
                  - metavariable-regex:
                      metavariable: $MIN
                      regex: '^[1-7]$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - pattern-regex: '(?i)\b\w*(password|passwd|pwd|passphrase|senha)\w*[ \t]+[\w.*\[\]]+[ \t]+`[^`\n]*(validate|binding):"[^"`\n]*\bmin=[1-7]\b'

  - id: jgates.go.password-max-length-below-64
    message: A password validator rejects passwords longer than a limit under 64 characters. Allow a maximum length of at least 64 so that passphrases are accepted, and cap it only to protect the hash function.
    severity: WARNING
    languages: [go]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.9"]
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: len($PW) > $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^([1-9]|[1-5][0-9]|6[0-3])$'
              - patterns:
                  - pattern: len($PW) >= $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^([1-9]|[1-5][0-9]|6[0-4])$'
              - patterns:
                  - pattern: utf8.RuneCountInString($PW) > $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^([1-9]|[1-5][0-9]|6[0-3])$'
              - patterns:
                  - pattern: validation.Field(&$S.$PW, ..., validation.Length($MIN, $MAX), ...)
                  - metavariable-regex:
                      metavariable: $MAX
                      regex: '^([1-9]|[1-5][0-9]|6[0-3])$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - pattern-regex: '(?i)\b\w*(password|passwd|pwd|passphrase|senha)\w*[ \t]+[\w.*\[\]]+[ \t]+`[^`\n]*(validate|binding):"[^"`\n]*\bmax=([1-9]|[1-5][0-9]|6[0-3])\b'

  - id: jgates.go.password-transformed-before-verify
    message: A password is lower-cased, upper-cased or cut before it is hashed or compared, which changes what the user typed and shrinks the secret. Hash and compare the password exactly as received.
    severity: WARNING
    languages: [go]
    mode: taint
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.8"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: strings.ToLower($PW)
              - pattern: strings.ToUpper($PW)
              - pattern: $PW[:$N]
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
    pattern-sinks:
      - patterns:
          - pattern: bcrypt.GenerateFromPassword($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: bcrypt.CompareHashAndPassword($H, $X)
          - focus-metavariable: $X
      - patterns:
          - pattern: argon2.IDKey($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: argon2.Key($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: scrypt.Key($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: pbkdf2.Key($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: subtle.ConstantTimeCompare($X, $Y)
          - focus-metavariable: $X

  - id: jgates.go.client-controlled-privilege
    message: A role, admin flag or permission field is set from the incoming request, so a caller can choose its own privilege. Take the privilege from a server-side record or a fixed value, never from request data.
    severity: WARNING
    languages: [go]
    mode: taint
    metadata:
      category: authorization
      cwe: "CWE-639"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.3.1"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.URL.Query().Get(...)
              - pattern: $R.Header.Get(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.DefaultQuery(...)
              - pattern: $R.PostForm(...)
              - pattern: $R.DefaultPostForm(...)
              - pattern: $R.Param(...)
              - pattern: $R.GetHeader(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.QueryParam(...)
              - pattern: $R.Param(...)
              - pattern: $R.FormValue(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.Params(...)
              - pattern: $R.FormValue(...)
    pattern-sinks:
      - patterns:
          - pattern: $U.$F = $X
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(role|roles|isadmin|admin|isstaff|issuperuser|isowner|permission|permissions|accesslevel|usertype|scope|scopes)$'
      - patterns:
          - pattern: '$T{..., $F: $X, ...}'
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(role|roles|isadmin|admin|isstaff|issuperuser|isowner|permission|permissions|accesslevel|usertype|scope|scopes)$'

  - id: jgates.go.totp-window-too-wide
    message: A one-time password library is configured with a period longer than 30 seconds or accepts more than one step on each side, which widens the time an intercepted code stays valid. Use a 30 second period and a skew of at most 1.
    severity: WARNING
    languages: [go]
    metadata:
      category: authentication
      cwe: "CWE-307"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.5.5"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: 'totp.ValidateOpts{..., Period: $V, ...}'
              - metavariable-regex:
                  metavariable: $V
                  regex: '^(3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})$'
          - patterns:
              - pattern: 'totp.GenerateOpts{..., Period: $V, ...}'
              - metavariable-regex:
                  metavariable: $V
                  regex: '^(3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})$'
          - patterns:
              - pattern: 'totp.ValidateOpts{..., Skew: $V, ...}'
              - metavariable-regex:
                  metavariable: $V
                  regex: '^([2-9]|[1-9][0-9]+)$'

  - id: jgates.go.secret-question-present
    message: A field or form value is named as a secret question or its answer, a recovery method the standard does not accept. Remove it and recover accounts with a one-time link or code sent to a verified address.
    severity: INFO
    languages: [go]
    metadata:
      category: authentication
      cwe: "CWE-640"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.4.2"]
    pattern-either:
      - pattern-regex: '(?im)^[ \t]*(secret|security)_?(question|answer)s?[ \t]+[\w.*\[\]]+'
      - patterns:
          - pattern-either:
              - pattern: $R.FormValue($F)
              - pattern: $R.PostForm($F)
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^"(secret|security)_?(question|answer)s?"$'
