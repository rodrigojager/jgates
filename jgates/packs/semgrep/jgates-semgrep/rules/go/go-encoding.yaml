          - pattern: blackfriday.Run(...)
          - pattern: blackfriday.MarkdownCommon(...)
          - pattern: blackfriday.MarkdownBasic(...)
          - pattern: markdown.ToHTML(...)
      - pattern-not-inside: $P.SanitizeBytes(...)
      - pattern-not-inside: $P.Sanitize(...)
