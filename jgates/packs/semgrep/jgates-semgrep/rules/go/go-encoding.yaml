  - id: jgates.go.double-decoding
    message: A value is URL-, HTML- or base64-decoded and then decoded again with the same decoder, so encoded input can slip past checks made after the first decode. Decode once and validate the result.
    severity: WARNING
    languages: [go]
    metadata:
      category: injection
      cwe: "CWE-174"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.1.1"]
    pattern-either:
      - pattern: html.UnescapeString(html.UnescapeString(...))
      - pattern: |
          $A := html.UnescapeString($X)
          ...
          $B := html.UnescapeString($A)
      - pattern: |
          $A, $E1 := url.QueryUnescape($X)
          ...
          $B, $E2 := url.QueryUnescape($A)
      - pattern: |
          $A, $E1 := url.PathUnescape($X)
          ...
          $B, $E2 := url.PathUnescape($A)
      - patterns:
          - pattern: |
              $A, $E1 := $ENC1.DecodeString($X)
              ...
              $B, $E2 := $ENC2.DecodeString(string($A))
          - metavariable-regex:
              metavariable: $ENC1
              regex: ^base64\.\w+$
          - metavariable-regex:
              metavariable: $ENC2
              regex: ^base64\.\w+$

  - id: jgates.go.markdown-raw-html-enabled
    message: A Markdown renderer is set to pass raw HTML through, or its output is not run through an HTML sanitizer. Leave raw HTML off (goldmark's default) or sanitize the result with bluemonday.
    severity: WARNING
    languages: [go]
    metadata:
      category: injection
      cwe: "CWE-79"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.3.5"]
    patterns:
