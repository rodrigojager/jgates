# Encoding rules for Go. Request sources: net/http (*http.Request), gin, echo, fiber and chi, as in go-taint.yaml.
# Sinks: regexp, fmt and log format functions, encoding/csv and excelize writers, gomemcache, URL and JSON string
# building; plus the double-decoding and Markdown rules.
rules:
  - id: jgates.go.regex-from-request
    message: Request data is compiled or matched as a regular expression. Escape it with regexp.QuoteMeta before it becomes part of a pattern.
    severity: WARNING
    languages: [go]
    mode: taint
    metadata:
      category: injection
      cwe: "CWE-1333"
      author: JGates
      subdimension: injection
      asvs_requirements: ["V1.2.9"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *http.Request, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *http.Request, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *http.Request, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.URL.Query().Get(...)
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.Header.Get(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *gin.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *gin.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.DefaultQuery(...)
              - pattern: $R.PostForm(...)
              - pattern: $R.DefaultPostForm(...)
              - pattern: $R.Param(...)
              - pattern: $R.GetHeader(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R echo.Context, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R echo.Context, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.QueryParam(...)
              - pattern: $R.Param(...)
              - pattern: $R.FormValue(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($X $T) $F(..., $R *fiber.Ctx, ...) $RET {
                    ...
                  }
          - pattern-either:
              - pattern: $R.Query(...)
              - pattern: $R.Params(...)
              - pattern: $R.FormValue(...)
      - pattern: chi.URLParam($R, ...)
    pattern-sanitizers:
      - pattern: regexp.QuoteMeta(...)
    pattern-sinks:
      - patterns:
          - pattern: regexp.Compile($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: regexp.MustCompile($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: regexp.CompilePOSIX($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: regexp.MustCompilePOSIX($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: regexp.MatchString($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: regexp.Match($P, ...)
          - focus-metavariable: $P

