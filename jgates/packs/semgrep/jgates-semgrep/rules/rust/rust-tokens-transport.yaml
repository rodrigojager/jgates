# Token validation and transport rules for Rust. Libraries covered: jsonwebtoken (decode, Validation, decode_header),
# reqwest (async and blocking), ureq, openssl (SslConnector, SslAcceptor), native-tls, and url for OAuth requests.
# Sources of jwt-key-from-token-header: the jku and x5u fields of a header returned by decode_header.
rules:
  - id: jgates.rust.jwt-signature-not-verified
    message: A token is decoded without verifying its signature, so anyone can forge its claims. Use jsonwebtoken::decode with a DecodingKey and a Validation instead.
    severity: ERROR
    languages: [rust]
    metadata:
      category: authorization
      cwe: "CWE-347"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.8.2", "V9.1.1"]
    pattern-either:
      - pattern: jsonwebtoken::dangerous::insecure_decode(...)
      - pattern: dangerous::insecure_decode(...)
      - pattern: insecure_decode(...)
      - pattern: jsonwebtoken::dangerous::insecure_decode::<$T>(...)
      - pattern: dangerous::insecure_decode::<$T>(...)
      - pattern: insecure_decode::<$T>(...)
      - pattern: jsonwebtoken::dangerous_insecure_decode(...)
      - pattern: dangerous_insecure_decode(...)
      - pattern: jsonwebtoken::dangerous_insecure_decode::<$T>(...)
      - pattern: dangerous_insecure_decode::<$T>(...)
      - pattern: jsonwebtoken::dangerous_unsafe_decode(...)
      - pattern: dangerous_unsafe_decode(...)
      - pattern: jsonwebtoken::dangerous_unsafe_decode::<$T>(...)
      - pattern: dangerous_unsafe_decode::<$T>(...)
      - pattern: $V.insecure_disable_signature_validation()

  - id: jgates.rust.jwt-algorithm-not-restricted
    message: The accepted signing algorithm is taken from the token's own header, so the sender chooses how it is checked. Fix the algorithm list in Validation to the one your issuer uses.
    severity: ERROR
    languages: [rust]
    metadata:
      category: authorization
      cwe: "CWE-327"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V9.1.2"]
    patterns:
      - pattern-inside: |
          let $H = $X;
          ...
      - metavariable-regex:
          metavariable: $X
          regex: (?s)^(jsonwebtoken::)?decode_header\(
      - pattern-either:
          - pattern: Validation::new($H.alg)
          - pattern: jsonwebtoken::Validation::new($H.alg)
          - pattern: $V.algorithms = vec![$H.alg];
          - pattern: $V.algorithms = [$H.alg].to_vec();

  - id: jgates.rust.jwt-key-from-token-header
    message: The verification key is fetched from an address named in the token's own header (jku or x5u), so the sender picks the key. Load keys from a configured issuer address and select by key id.
    severity: WARNING
    languages: [rust]
    mode: taint
    metadata:
      category: authorization
      cwe: "CWE-347"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V9.1.3"]
    pattern-sources:
      - patterns:
          - pattern-inside: |
              let $H = $X;
              ...
          - metavariable-regex:
              metavariable: $X
              regex: (?s)^(jsonwebtoken::)?decode_header\(
          - pattern-either:
              - pattern: $H.jku
              - pattern: $H.x5u
    pattern-sinks:
      - patterns:
          - pattern: reqwest::get($X)
          - focus-metavariable: $X
      - patterns:
          - pattern: reqwest::blocking::get($X)
          - focus-metavariable: $X
      - patterns:
          - pattern: ureq::get($X)
          - focus-metavariable: $X
      - patterns:
          - pattern: $C.get($X)
          - pattern-inside: |
              let $C = reqwest::Client::new();
              ...
          - focus-metavariable: $X
      - patterns:
          - pattern: $C.get($X)
          - pattern-inside: |
              let $C = reqwest::blocking::Client::new();
              ...
          - focus-metavariable: $X

  - id: jgates.rust.jwt-expiry-not-validated
    message: Expiry validation of the token is switched off, so a stolen token works forever. Leave validate_exp on and set the leeway to a few seconds at most.
    severity: ERROR
    languages: [rust]
    metadata:
      category: authorization
      cwe: "CWE-613"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V9.2.1"]
    pattern: $V.validate_exp = false

  - id: jgates.rust.jwt-audience-not-validated
    message: Audience validation of the token is switched off, so a token minted for another service is accepted here. Keep validate_aud on and name this service with set_audience.
    severity: WARNING
    languages: [rust]
    metadata:
      category: authorization
      cwe: "CWE-287"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V9.2.3", "V10.3.1"]
    pattern: $V.validate_aud = false

  - id: jgates.rust.oauth-request-without-state
    message: An OAuth authorization URL is built with neither a state nor a code challenge visible in the URL. If another layer does not add and validate request binding, the callback may not be tied to the initiating request; add and validate a random state and PKCE or confirm where equivalent protection is enforced.
    severity: INFO
    languages: [rust]
    metadata:
      category: authorization
      cwe: "CWE-352"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V10.2.1"]
      class: review
    patterns:
      - pattern-either:
          - pattern: format!("$S", ...)
          - pattern: Url::parse("$S")
          - pattern: url::Url::parse("$S")
      - metavariable-regex:
          metavariable: $S
          regex: (?s)^(?!.*(state=|code_challenge=)).*response_type=(code|token)

  - id: jgates.rust.tls-old-protocol-version
    message: The TLS configuration allows SSL 3, TLS 1.0 or TLS 1.1, which are broken or deprecated. Set the minimum version to TLS 1.2 or higher.
    severity: ERROR
    languages: [rust]
    metadata:
      category: transport
      cwe: "CWE-326"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V12.1.1"]
    pattern-either:
      - pattern: $B.set_min_proto_version(Some(SslVersion::SSL3))
      - pattern: $B.set_min_proto_version(Some(SslVersion::TLS1))
      - pattern: $B.set_min_proto_version(Some(SslVersion::TLS1_1))
      - pattern: $B.set_min_proto_version(Some(openssl::ssl::SslVersion::SSL3))
      - pattern: $B.set_min_proto_version(Some(openssl::ssl::SslVersion::TLS1))
      - pattern: $B.set_min_proto_version(Some(openssl::ssl::SslVersion::TLS1_1))
      - pattern: $B.min_protocol_version(Some(Protocol::Sslv3))
      - pattern: $B.min_protocol_version(Some(Protocol::Tlsv10))
      - pattern: $B.min_protocol_version(Some(Protocol::Tlsv11))
      - pattern: $B.min_protocol_version(Some(native_tls::Protocol::Sslv3))
      - pattern: $B.min_protocol_version(Some(native_tls::Protocol::Tlsv10))
      - pattern: $B.min_protocol_version(Some(native_tls::Protocol::Tlsv11))
      - pattern: $B.min_tls_version(tls::Version::TLS_1_0)
      - pattern: $B.min_tls_version(tls::Version::TLS_1_1)
      - pattern: $B.min_tls_version(reqwest::tls::Version::TLS_1_0)
      - pattern: $B.min_tls_version(reqwest::tls::Version::TLS_1_1)

  - id: jgates.rust.tls-weak-cipher-suite
    message: A cipher suite list names null, export, RC4, DES or 3DES suites, which give no or broken protection. List only AEAD suites (AES-GCM, ChaCha20-Poly1305) or use the library default.
    severity: WARNING
    languages: [rust]
    metadata:
      category: transport
      cwe: "CWE-327"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V12.1.2"]
    patterns:
      - pattern-either:
          - pattern: $B.set_cipher_list("$L")
          - pattern: $B.set_ciphersuites("$L")
      - metavariable-regex:
          metavariable: $L
          regex: (?is)^(.*:)?(e?NULL[\w-]*|EXP(ORT)?[\w-]*|[\w-]*RC4[\w-]*|[\w-]*3DES[\w-]*|DES[\w-]*)(:.*)?$

  - id: jgates.rust.cleartext-http-url
    message: A network client is given a clear-text HTTP or FTP address, so the traffic can be read or changed on the way. Use the HTTPS address of the same service.
    severity: INFO
    languages: [rust]
    metadata:
      category: transport
      cwe: "CWE-319"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V12.2.1", "V12.3.1", "V12.3.3"]
    patterns:
      - pattern-either:
          - pattern: reqwest::get("$U")
          - pattern: reqwest::blocking::get("$U")
          - pattern: ureq::get("$U")
          - pattern: ureq::post("$U")
          - pattern: ureq::put("$U")
          - pattern: ureq::delete("$U")
          - pattern: surf::get("$U")
          - pattern: surf::post("$U")
          - pattern: isahc::get("$U")
          - pattern: isahc::get_async("$U")
          - pattern: attohttpc::get("$U")
          - pattern: attohttpc::post("$U")
          - pattern: minreq::get("$U")
          - pattern: minreq::post("$U")
          - patterns:
              - pattern-either:
                  - pattern: reqwest::Client::new().$M("$U")
                  - pattern: reqwest::blocking::Client::new().$M("$U")
                  - patterns:
                      - pattern: $C.$M("$U")
                      - pattern-either:
                          - pattern-inside: |
                              let $C = reqwest::Client::new();
                              ...
                          - pattern-inside: |
                              let $C = reqwest::blocking::Client::new();
                              ...
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(get|post|put|patch|delete|head)$
      - metavariable-regex:
          metavariable: $U
          regex: (?i)^(http|ftp)://(?!(localhost|127\.|\[::1\]|0\.0\.0\.0))
