# Password policy, password handling, client-controlled privilege and one-time passwords for Rust.
# Libraries covered: standard library length checks (len, chars().count()) on password-like values, the validator
# crate attribute (#[validate(length(...))]) on password-like fields, bcrypt / argon2 / password-hash for password
# transformation, axum and actix-web extractors (Query, Path, Form, Json, with or without web::) for privilege
# fields, totp-rs (TOTP::new) and totp-lite (totp_custom) for one-time passwords.
# Names like a password: password, passwd, pwd, passphrase, senha (matched case-insensitively).
rules:
  - id: jgates.rust.password-min-length-below-8
    message: A password validator accepts passwords shorter than 8 characters. Require a minimum length of at least 8 (preferably 12 or more) and check it with the validator's minimum, not a smaller literal.
    severity: ERROR
    languages: [rust]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.1"]
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $PW.len() < $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^[0-7]$'
              - patterns:
                  - pattern: $PW.len() <= $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^[0-6]$'
              - patterns:
                  - pattern: $PW.chars().count() < $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^[0-7]$'
              - patterns:
                  - pattern: $PW.chars().count() <= $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^[0-6]$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - pattern-regex: '(?i)#\[validate\([^\]\n]*\bmin\s*=\s*[1-7]\b[^\]\n]*\]\s*(#\[[^\]\n]*\]\s*)*(pub(\([a-z]+\))?\s+)?\w*(password|passwd|pwd|passphrase|senha)\w*\s*:'

  - id: jgates.rust.password-max-length-below-64
    message: A password validator rejects passwords longer than a limit under 64 characters. Allow a maximum length of at least 64 so that passphrases are accepted, and cap it only to protect the hash function.
    severity: WARNING
    languages: [rust]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.9"]
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $PW.len() > $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^([1-9]|[1-5][0-9]|6[0-3])$'
              - patterns:
                  - pattern: $PW.len() >= $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^([1-9]|[1-5][0-9]|6[0-4])$'
              - patterns:
                  - pattern: $PW.chars().count() > $N
                  - metavariable-regex:
                      metavariable: $N
                      regex: '^([1-9]|[1-5][0-9]|6[0-3])$'
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
      - pattern-regex: '(?i)#\[validate\([^\]\n]*\bmax\s*=\s*([1-9]|[1-5][0-9]|6[0-3])\b[^\]\n]*\]\s*(#\[[^\]\n]*\]\s*)*(pub(\([a-z]+\))?\s+)?\w*(password|passwd|pwd|passphrase|senha)\w*\s*:'

  - id: jgates.rust.password-composition-rule
    message: A password policy demands character classes through look-ahead patterns. Composition rules push users to predictable passwords; check length and screen against breached passwords instead.
    severity: INFO
    languages: [rust]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.5"]
    pattern-regex: '(?i)(password|passwd|pwd|passphrase|senha)[^\n]*\(\?=\.\*(\[[^\]\n]+\]|\\+[dDwWsS])\)'

  - id: jgates.rust.password-transformed-before-verify
    message: A password is lower-cased, upper-cased or cut before it is hashed or compared, which changes what the user typed and shrinks the secret. Hash and compare the password exactly as received.
    severity: WARNING
    languages: [rust]
    mode: taint
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.8"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $PW.to_lowercase()
              - pattern: $PW.to_uppercase()
              - pattern: $PW.to_ascii_lowercase()
              - pattern: $PW.to_ascii_uppercase()
              - pattern: $PW.chars().take($N).collect::<String>()
              - pattern: $PW[..$N]
              - pattern: $PW[0..$N]
          - metavariable-regex:
              metavariable: $PW
              regex: '(?i).*(password|passwd|pwd|passphrase|senha).*'
    pattern-sinks:
      - patterns:
          - pattern: bcrypt::hash($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: bcrypt::verify($X, $H)
          - focus-metavariable: $X
      - patterns:
          - pattern: $A.hash_password($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: $A.hash_password($X.as_bytes(), ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: $A.verify_password($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: $A.verify_password($X.as_bytes(), ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: argon2::hash_encoded($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: argon2::verify_encoded($H, $X)
          - focus-metavariable: $X

  - id: jgates.rust.client-controlled-privilege
    message: A role, admin flag or permission field is set from the incoming request, so a caller can choose its own privilege. Take the privilege from a server-side record or a fixed value, never from request data.
    severity: WARNING
    languages: [rust]
    mode: taint
    metadata:
      category: authorization
      cwe: "CWE-639"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.3.1"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  async fn $F(..., Query($P): Query<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., Path($P): Path<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., Form($P): Form<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., Json($P): Json<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., $P: Query<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., $P: Path<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., $P: Form<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., $P: Json<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., $P: web::Query<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., $P: web::Path<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., $P: web::Form<$T>, ...) { ... }
              - pattern-inside: |
                  async fn $F(..., $P: web::Json<$T>, ...) { ... }
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern: $U.$F = $X
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(role|roles|is_admin|admin|is_staff|is_superuser|is_owner|permission|permissions|access_level|user_type|scope|scopes)$'
      - patterns:
          - pattern-either:
              - pattern: '$T { $F: $X }'
              - pattern: '$T { $F: $X, $G2: $Y2 }'
              - pattern: '$T { $G1: $Y1, $F: $X }'
              - pattern: '$T { $F: $X, $G2: $Y2, $G3: $Y3 }'
              - pattern: '$T { $G1: $Y1, $F: $X, $G3: $Y3 }'
              - pattern: '$T { $G1: $Y1, $G2: $Y2, $F: $X }'
              - pattern: '$T { $F: $X, $G2: $Y2, $G3: $Y3, $G4: $Y4 }'
              - pattern: '$T { $G1: $Y1, $F: $X, $G3: $Y3, $G4: $Y4 }'
              - pattern: '$T { $G1: $Y1, $G2: $Y2, $F: $X, $G4: $Y4 }'
              - pattern: '$T { $G1: $Y1, $G2: $Y2, $G3: $Y3, $F: $X }'
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(role|roles|is_admin|admin|is_staff|is_superuser|is_owner|permission|permissions|access_level|user_type|scope|scopes)$'

  - id: jgates.rust.totp-window-too-wide
    message: A one-time password library is configured with a period longer than 30 seconds or accepts more than one step on each side, which widens the time an intercepted code stays valid. Use a 30 second period and a skew of at most 1.
    severity: WARNING
    languages: [rust]
    metadata:
      category: authentication
      cwe: "CWE-307"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.5.5"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: TOTP::new($A, $D, $SKEW, $STEP, ...)
              - metavariable-regex:
                  metavariable: $STEP
                  regex: '^(3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})(_?u64)?$'
          - patterns:
              - pattern: TOTP::new($A, $D, $SKEW, $STEP, ...)
              - metavariable-regex:
                  metavariable: $SKEW
                  regex: '^([2-9]|[1-9][0-9]+)(_?u8)?$'
          - patterns:
              - pattern: totp_rs::TOTP::new($A, $D, $SKEW, $STEP, ...)
              - metavariable-regex:
                  metavariable: $STEP
                  regex: '^(3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})(_?u64)?$'
          - patterns:
              - pattern: totp_rs::TOTP::new($A, $D, $SKEW, $STEP, ...)
              - metavariable-regex:
                  metavariable: $SKEW
                  regex: '^([2-9]|[1-9][0-9]+)(_?u8)?$'
          - patterns:
              - pattern: totp_custom::<$H>($STEP, ...)
              - metavariable-regex:
                  metavariable: $STEP
                  regex: '^(3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})(_?u64)?$'

  - id: jgates.rust.secret-question-present
    message: A field or form value is named as a secret question or its answer, a recovery method the standard does not accept. Remove it and recover accounts with a one-time link or code sent to a verified address.
    severity: INFO
    languages: [rust]
    metadata:
      category: authentication
      cwe: "CWE-640"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.4.2"]
    pattern-either:
      - pattern-regex: '(?im)^[ \t]*(pub(\([a-z]+\))?[ \t]+)?(secret|security)_?(question|answer)s?[ \t]*:'
      - pattern-regex: '(?i)"(secret|security)_?(question|answer)s?"'
