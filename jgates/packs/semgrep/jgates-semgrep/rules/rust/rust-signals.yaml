          - pattern: pub use $M;
          - pattern: extern crate $M;
      - metavariable-regex:
          metavariable: $M
          regex: '(?s)^(::)?(?:(?:webrtc[a-z0-9_]*|rtc|str0m|datachannel[a-z0-9_]*|libdatachannel|livekit[a-z0-9_]*|mediasoup[a-z0-9_]*|matchbox_(?:socket|signaling)|gstreamer_webrtc|gst_webrtc|rheomesh|[a-z0-9_]+_webrtc)(?:::|$|\s)|web_sys::.*Rtc[A-Z])'

