# Signal rules of the Rust front: which technologies a project uses (jgates.rust.uses-<tag>).
# They are records of the scan, never findings: they feed the "not applicable" suggestions.
# Each rule matches the `use` (or `extern crate`) of the crates that bring the technology into a Rust project, or the
# typical module of the standard library where no dependency is needed. Imports are syntax, so a comment or a string
# that only mentions a crate does not match. A path written in full at the call site without a `use` is not seen.
# The tag "latex" has no signal in Rust: no crate is common enough to list with confidence.
rules:
  - id: jgates.rust.uses-graphql
    message: The project uses GraphQL.
    severity: INFO
    languages: [rust]
    metadata:
      signal: graphql
      author: JGates
    patterns:
      - pattern-either:
          - pattern: use $M;
          - pattern: pub use $M;
          - pattern: extern crate $M;
      - metavariable-regex:
          metavariable: $M
          regex: '^(::)?(?:graphql[a-z0-9_]*|[a-z0-9_]*_graphql[a-z0-9_]*|juniper[a-z0-9_]*|cynic[a-z0-9_]*|apollo_[a-z0-9_]+|seaography[a-z0-9_]*|gql_[a-z0-9_]+|[a-z0-9_]+_gql|hasura[a-z0-9_]*)(?:::|$|\s)'

  - id: jgates.rust.uses-websocket
    message: The project uses WebSocket.
    severity: INFO
    languages: [rust]
    metadata:
      signal: websocket
      author: JGates
    patterns:
      - pattern-either:
          - pattern: use $M;
          - pattern: pub use $M;
          - pattern: extern crate $M;
      - metavariable-regex:
          metavariable: $M
          regex: '(?s)^(::)?(?:(?:(?:tokio_|async_)?tungstenite[a-z0-9_]*|tokio_websockets|fastwebsockets|websocket[a-z0-9_]*|ws|ws_[a-z0-9_]+|[a-z0-9_]+_ws|[a-z0-9_]+_websockets?|actix_ws|actix_web_actors|soketto|yawc|socketioxide[a-z0-9_]*|rust_socketio|rocket_ws|tide_websockets|ewebsock|hyper_tungstenite)(?:::|$|\s)|gloo_net::.*[Ww]eb[Ss]ocket|web_sys::.*WebSocket|(?:axum|axum_extra|warp|poem|salvo|actix_web)::.*[Ww]eb[Ss]ocket|(?:axum|axum_extra|warp)::.*\bws\b)'

