# Rust cryptography rules for the RustCrypto hash and cipher crates (md5, sha1, des, rc4, blowfish), the openssl crate,
# reqwest, native-tls and rustls, when the types are imported by their short names (the openssl digest and cipher
# constructors also by their module path).
rules:
  - id: jgates.rust.weak-hash
    message: MD2, MD4, MD5 and SHA-1 are broken for security use. Use SHA-256 or stronger, and an Argon2 or bcrypt crate for passwords.
    severity: ERROR
    languages: [rust]
    metadata:
      category: weak-crypto
      cwe: "CWE-327"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V11.4.1"]
    pattern-either:
      - pattern: md5::compute(...)
      - pattern: Md5::new()
      - pattern: Md5::digest(...)
      - pattern: Md4::new()
      - pattern: Md4::digest(...)
      - pattern: Md2::new()
      - pattern: Md2::digest(...)
      - pattern: Sha1::new()
      - pattern: Sha1::digest(...)
      - pattern: MessageDigest::md5()
      - pattern: MessageDigest::sha1()
      - pattern: hash::MessageDigest::md5()
      - pattern: hash::MessageDigest::sha1()
      - pattern: openssl::hash::MessageDigest::md5()
      - pattern: openssl::hash::MessageDigest::sha1()

  - id: jgates.rust.weak-cipher
    message: DES, 3DES, RC4, Blowfish and ECB mode are weak. Use AES-GCM or ChaCha20-Poly1305.
    severity: ERROR
    languages: [rust]
    metadata:
      category: weak-crypto
      cwe: "CWE-327"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V11.3.1", "V11.3.2"]
    pattern-either:
      - pattern: Des::new(...)
      - pattern: Des::new_from_slice(...)
      - pattern: TdesEde2::new(...)
      - pattern: TdesEde2::new_from_slice(...)
      - pattern: TdesEde3::new(...)
      - pattern: TdesEde3::new_from_slice(...)
      - pattern: Rc4::new(...)
      - pattern: Blowfish::new(...)
      - pattern: Blowfish::new_from_slice(...)
      # The openssl Cipher constructors, by the short name or the module path.
      - patterns:
          - pattern-either:
              - pattern: Cipher::$MODE()
              - pattern: symm::Cipher::$MODE()
              - pattern: openssl::symm::Cipher::$MODE()
          - metavariable-regex:
              metavariable: $MODE
              regex: ^(des_cbc|des_ede3|des_ede3_cbc|rc4|bf_cbc|aes_128_ecb|aes_192_ecb|aes_256_ecb)$

  - id: jgates.rust.tls-verification-disabled
    message: Certificate or host name verification is turned off. Keep verification on and trust a private CA explicitly if one is needed.
    severity: ERROR
    languages: [rust]
    metadata:
      category: weak-crypto
      cwe: "CWE-295"
      author: JGates
      subdimension: cryptography
      asvs_requirements: ["V12.3.2"]
    pattern-either:
      - pattern: $B.danger_accept_invalid_certs(true)
      - pattern: $B.danger_accept_invalid_hostnames(true)
      - pattern: $B.set_verify(SslVerifyMode::NONE)
      - pattern: $B.set_verify(openssl::ssl::SslVerifyMode::NONE)
      - pattern: $C.dangerous().set_certificate_verifier($V)
