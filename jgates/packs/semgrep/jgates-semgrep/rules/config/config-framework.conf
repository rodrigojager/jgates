# ruleid: jgates.config.cookie-without-secure
proxy_cookie_flags ~ nosecure;
# ok: jgates.config.cookie-without-secure
proxy_cookie_flags ~ secure httponly samesite=lax;
# ruleid: jgates.config.cookie-without-httponly
proxy_cookie_flags ~ nohttponly;
# ok: jgates.config.cookie-without-httponly
proxy_cookie_flags ~ httponly;
# ruleid: jgates.config.security-headers-disabled
more_clear_headers 'X-Content-Type-Options';
# ruleid: jgates.config.security-headers-disabled
add_header Strict-Transport-Security "max-age=86400" always;
# ok: jgates.config.security-headers-disabled
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
# ok: jgates.config.security-headers-disabled
more_clear_headers 'Server';

# The rest of this file holds YAML-shaped and JSON-shaped text: Semgrep would load a .yml or .json fixture as a rule file.
# --- Spring application.yml
server:
  servlet:
    session:
      # ruleid: jgates.config.cookie-without-secure
      cookie:
        secure: false
  # ruleid: jgates.config.stack-trace-in-response
  error:
    include-stacktrace: always
other:
  # ok: jgates.config.cookie-without-secure
  cookie:
    secure: true
    http-only: true
cookies:
  # ruleid: jgates.config.cookie-without-httponly
  cookie:
    name: sid
    http-only: false
safe:
  # ok: jgates.config.stack-trace-in-response
  error:
    include-stacktrace: never
    include-message: never
  # ok: jgates.config.cookie-without-httponly
  cookie:
    http-only: true
spring:
  graphql:
    schema:
      # ruleid: jgates.config.graphql-introspection-enabled
      introspection:
        enabled: true
      # ok: jgates.config.graphql-introspection-enabled
      introspection:
        enabled: false
management:
  endpoints:
    web:
      # ruleid: jgates.config.docs-or-monitoring-endpoint-exposed
      exposure:
        include: "*"
      # ok: jgates.config.docs-or-monitoring-endpoint-exposed
      exposure:
        include: "health,info"
# ruleid: jgates.config.debug-mode-enabled
debug: true
# ok: jgates.config.debug-mode-enabled
debug: false
# --- Symfony config/packages/framework.yaml
framework:
  # ruleid: jgates.config.csrf-protection-disabled
  csrf_protection: false
  session:
    # ruleid: jgates.config.cookie-without-secure
    cookie_secure: false
    # ruleid: jgates.config.cookie-without-httponly
    cookie_httponly: false
security:
  firewalls:
    main:
      form_login:
        # ruleid: jgates.config.csrf-protection-disabled
        enable_csrf: false
ok_block:
  # ok: jgates.config.csrf-protection-disabled
  csrf_protection: true
  # ok: jgates.config.csrf-protection-disabled
  enable_csrf: true
  # ok: jgates.config.cookie-without-secure
  cookie_secure: auto
# --- .NET appsettings.json
{
  // ruleid: jgates.config.stack-trace-in-response
  "DetailedErrors": true,
  // ok: jgates.config.stack-trace-in-response
  "DetailedErrors": false
}
