# ---- config.directory-listing-enabled
# ruleid: jgates.config.directory-listing-enabled
autoindex on;
# ruleid: jgates.config.directory-listing-enabled
Options +Indexes FollowSymLinks
# ruleid: jgates.config.directory-listing-enabled
Options Indexes
# ruleid: jgates.config.directory-listing-enabled
Options All
# ruleid: jgates.config.directory-listing-enabled
dir-listing.activate = "enable"
# ruleid: jgates.config.directory-listing-enabled
file_server browse
# ok: jgates.config.directory-listing-enabled
autoindex off;
# ok: jgates.config.directory-listing-enabled
Options -Indexes +FollowSymLinks
# ok: jgates.config.directory-listing-enabled
Options All -Indexes
# ok: jgates.config.directory-listing-enabled
file_server

# ---- config.http-trace-enabled
# ruleid: jgates.config.http-trace-enabled
TraceEnable On
# ruleid: jgates.config.http-trace-enabled
TraceEnable extended
# ok: jgates.config.http-trace-enabled
TraceEnable Off

# ---- config.version-header-exposed
# ruleid: jgates.config.version-header-exposed
server_tokens on;
# ruleid: jgates.config.version-header-exposed
ServerTokens Full
# ruleid: jgates.config.version-header-exposed
ServerSignature On
# ok: jgates.config.version-header-exposed
server_tokens off;
# ok: jgates.config.version-header-exposed
ServerTokens Prod
# ok: jgates.config.version-header-exposed
ServerSignature Off
