# Fixture of config-server.yaml for the nginx, Apache httpd, lighttpd and Caddy formats. Never loaded by a server.

# ---- config.tls-old-protocol-version
# ruleid: jgates.config.tls-old-protocol-version
ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
# ruleid: jgates.config.tls-old-protocol-version
ssl_protocols TLSv1.2 SSLv3;
# ruleid: jgates.config.tls-old-protocol-version
SSLProtocol all -SSLv3
# ruleid: jgates.config.tls-old-protocol-version
SSLProtocol +TLSv1.1 +TLSv1.2
# ok: jgates.config.tls-old-protocol-version
ssl_protocols TLSv1.2 TLSv1.3;
# ok: jgates.config.tls-old-protocol-version
SSLProtocol -all +TLSv1.2 +TLSv1.3
# ok: jgates.config.tls-old-protocol-version
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
# ok: jgates.config.tls-old-protocol-version
# ssl_protocols TLSv1 TLSv1.1;

# ---- config.tls-weak-cipher-suite
# ruleid: jgates.config.tls-weak-cipher-suite
ssl_ciphers "ECDHE-RSA-AES128-GCM-SHA256:RC4-SHA";
# ruleid: jgates.config.tls-weak-cipher-suite
ssl_ciphers HIGH:aNULL:!MD5;
# ruleid: jgates.config.tls-weak-cipher-suite
SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA384:DES-CBC3-SHA
# ruleid: jgates.config.tls-weak-cipher-suite
SSLCipherSuite EXPORT:HIGH
# ok: jgates.config.tls-weak-cipher-suite
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305";
# ok: jgates.config.tls-weak-cipher-suite
ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5;
# ok: jgates.config.tls-weak-cipher-suite
SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA384:-RC4:-3DES

# The YAML forms (Spring application.yml) live in this file: a `.yml` fixture beside the rules would be read by Semgrep as a rule file.
# ruleid: jgates.config.tls-old-protocol-version
