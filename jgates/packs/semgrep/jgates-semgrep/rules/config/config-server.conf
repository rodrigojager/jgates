# ruleid: jgates.config.tls-old-protocol-version
    enabled-protocols: [TLSv1.2, TLSv1]
# ruleid: jgates.config.tls-old-protocol-version
    enabled-protocols:
      - TLSv1.2
      - SSLv3
# ok: jgates.config.tls-old-protocol-version
    enabled-protocols: TLSv1.2,TLSv1.3
# ok: jgates.config.tls-old-protocol-version
    enabled-protocols:
      - TLSv1.2
      - TLSv1.3
# ruleid: jgates.config.tls-weak-cipher-suite
    ciphers: TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_RC4_128_SHA
# ruleid: jgates.config.tls-weak-cipher-suite
    ciphers:
      - TLS_AES_128_GCM_SHA256
      - TLS_RSA_EXPORT_WITH_DES40_CBC_SHA
# ok: jgates.config.tls-weak-cipher-suite
    ciphers: TLS_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
# ok: jgates.config.tls-weak-cipher-suite
    ciphers:
      - TLS_AES_128_GCM_SHA256
      - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

