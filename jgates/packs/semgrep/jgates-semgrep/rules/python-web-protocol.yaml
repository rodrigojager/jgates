# Web protocol checks for Python: security headers, Content-Security-Policy, WebSocket, GraphQL,
# redirects and forwarded headers.
# Frameworks covered: Django (settings and responses), Flask and Flask-Talisman, Flask-SocketIO,
# python-socketio, Tornado, Starlette/FastAPI redirects, websockets, websocket-client, aiohttp,
# Ariadne and Strawberry (GraphQL).
rules:
  - id: jgates.python.security-headers-disabled
    message: A security response header (HSTS, Content-Security-Policy, nosniff or frame protection) is switched off or set too weak. Keep the header on, with a Strict-Transport-Security max-age of at least one year.
    severity: WARNING
    languages: [python]
    metadata:
      category: configuration
      cwe: "CWE-693"
      subdimension: hardening
      author: JGates
      asvs_requirements: ["V3.4.1", "V3.4.3", "V3.4.4", "V3.4.6"]
    pattern-either:
      - pattern: Talisman(..., strict_transport_security=False, ...)
      - pattern: flask_talisman.Talisman(..., strict_transport_security=False, ...)
      - pattern: Talisman(..., content_security_policy=None, ...)
      - pattern: flask_talisman.Talisman(..., content_security_policy=None, ...)
      - pattern: Talisman(..., frame_options=None, ...)
      - pattern: flask_talisman.Talisman(..., frame_options=None, ...)
      - pattern: Talisman(..., x_content_type_options=False, ...)
      - pattern: flask_talisman.Talisman(..., x_content_type_options=False, ...)
      - pattern: SECURE_CONTENT_TYPE_NOSNIFF = False
      - patterns:
          - pattern-either:
              - pattern: SECURE_HSTS_SECONDS = $N
              - pattern: Talisman(..., strict_transport_security_max_age=$N, ...)
              - pattern: flask_talisman.Talisman(..., strict_transport_security_max_age=$N, ...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 31536000

  - id: jgates.python.csp-unsafe-directive
    message: A Content-Security-Policy allows inline scripts, eval or any source for scripts. Drop 'unsafe-inline', 'unsafe-eval' and the wildcard, and use nonces or hashes for the scripts the page needs.
    severity: WARNING
    languages: [python]
    metadata:
      category: configuration
      cwe: "CWE-693"
      subdimension: hardening
      author: JGates
      asvs_requirements: ["V3.4.3"]
    patterns:
      - pattern-either:
          - pattern: $O.headers[$K] = $V
          - pattern: $O[$K] = $V
          - pattern: $O.headers.set($K, $V)
          - pattern: $O.headers.add($K, $V)
          - pattern: $O.headers.setdefault($K, $V)
          - pattern: ($K, $V)
          - pattern: "{..., $K: $V, ...}"
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^["']content-security-policy["']$
      - metavariable-regex:
          metavariable: $V
          regex: (?is)^.*?(script-src|default-src|script-src-elem)[^;]*('unsafe-inline'|'unsafe-eval'|\s\*(\s|;|["']$))

  # the same policy handed to Flask-Talisman as a dictionary
  - id: jgates.python.csp-unsafe-directive-talisman
    message: A Content-Security-Policy allows inline scripts, eval or any source for scripts. Drop 'unsafe-inline', 'unsafe-eval' and the wildcard, and use nonces or hashes for the scripts the page needs.
    severity: WARNING
    languages: [python]
    metadata:
      category: configuration
      cwe: "CWE-693"
      subdimension: hardening
      author: JGates
      asvs_requirements: ["V3.4.3"]
    patterns:
      - pattern-either:
          - pattern: 'Talisman(..., content_security_policy={..., $K: $V, ...}, ...)'
          - pattern: 'flask_talisman.Talisman(..., content_security_policy={..., $K: $V, ...}, ...)'
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^["'](script-src|default-src|script-src-elem)["']$
      - metavariable-regex:
          metavariable: $V
          regex: (?is)^(.*('unsafe-inline'|'unsafe-eval')|["']\*["']$|.*[\[,]\s*["']\*["'])

  - id: jgates.python.websocket-without-tls
    message: A WebSocket is opened to a plain ws:// address that is not the local machine, so the traffic is readable and changeable on the network. Use a wss:// address.
    severity: WARNING
    languages: [python]
    metadata:
      category: transport
      cwe: "CWE-319"
      subdimension: hardening
      author: JGates
      asvs_requirements: ["V4.4.1"]
    patterns:
      - pattern-either:
          - pattern: websocket.create_connection($U, ...)
          - pattern: websocket.WebSocketApp($U, ...)
          - pattern: websockets.connect($U, ...)
          - pattern: websockets.client.connect($U, ...)
          - pattern: websockets.asyncio.client.connect($U, ...)
          - pattern: websockets.sync.client.connect($U, ...)
          - pattern: $S.ws_connect($U, ...)
      - metavariable-regex:
          metavariable: $U
          regex: (?i)^[rbu]*["']ws://(?!localhost([:/"']|$)|127\.|\[::1\]|::1)

  - id: jgates.python.websocket-origin-not-checked
    message: A WebSocket server accepts connections from every origin, so any web page can open one on behalf of a signed-in user. Compare the Origin header with a list of your own origins.
    severity: ERROR
    languages: [python]
    metadata:
      category: authorization
      cwe: "CWE-1385"
      subdimension: authorization
      author: JGates
      asvs_requirements: ["V4.4.2"]
    pattern-either:
      - pattern: |
          def check_origin($SELF, $ORIGIN):
              return True
      - pattern: SocketIO(..., cors_allowed_origins="*", ...)
      - pattern: flask_socketio.SocketIO(..., cors_allowed_origins="*", ...)
      - pattern: socketio.Server(..., cors_allowed_origins="*", ...)
      - pattern: socketio.AsyncServer(..., cors_allowed_origins="*", ...)

  - id: jgates.python.graphql-introspection-enabled
    message: A GraphQL server is created with introspection switched on, which hands the whole schema to anyone who asks. Turn it off outside development.
    severity: INFO
    languages: [python]
    metadata:
      category: configuration
      cwe: "CWE-200"
      subdimension: hardening
      author: JGates
      asvs_requirements: ["V4.3.2"]
    pattern-either:
      - pattern: GraphQL(..., introspection=True, ...)
      - pattern: ariadne.asgi.GraphQL(..., introspection=True, ...)
      - pattern: ariadne.wsgi.GraphQL(..., introspection=True, ...)

  - id: jgates.python.graphql-without-depth-limit
    message: A GraphQL server is created without any query depth, amount or cost limit, so one request can ask for an unbounded amount of work. Add a depth or cost validation rule.
    severity: INFO
    languages: [python]
    metadata:
      category: availability
      cwe: "CWE-770"
      subdimension: hardening
      author: JGates
      asvs_requirements: ["V4.3.1"]
    patterns:
      - pattern-either:
          - pattern: GraphQL($SCHEMA, ...)
          - pattern: ariadne.asgi.GraphQL($SCHEMA, ...)
          - pattern: strawberry.Schema(...)
      - pattern-not: GraphQL(..., validation_rules=..., ...)
      - pattern-not: ariadne.asgi.GraphQL(..., validation_rules=..., ...)
      - pattern-not: strawberry.Schema(..., extensions=[..., QueryDepthLimiter(...), ...], ...)
      - pattern-not: strawberry.Schema(..., extensions=[..., MaxTokensLimiter(...), ...], ...)
      - pattern-not: strawberry.Schema(..., extensions=[..., MaxAliasesLimiter(...), ...], ...)

  - id: jgates.python.open-redirect
    message: A redirect target comes from the incoming request, so a crafted link can send users to another site. Redirect to a route name, or check the target against your own hosts first.
    severity: ERROR
    languages: [python]
    mode: taint
    metadata:
      category: injection
      cwe: "CWE-601"
      subdimension: injection
      author: JGates
      asvs_requirements: ["V3.7.2"]
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.args[...]
      - pattern: request.form.get(...)
      - pattern: request.form[...]
      - pattern: request.values.get(...)
      - pattern: request.json
      - pattern: request.get_json(...)
      - pattern: request.GET.get(...)
      - pattern: request.GET[...]
      - pattern: request.POST.get(...)
      - pattern: request.POST[...]
      - pattern: request.query_params.get(...)
    pattern-sanitizers:
      - pattern: url_for(...)
      - pattern: reverse(...)
    pattern-sinks:
      - patterns:
          - pattern: redirect($U, ...)
          - focus-metavariable: $U
      - patterns:
          - pattern: HttpResponseRedirect($U, ...)
          - focus-metavariable: $U
      - patterns:
          - pattern: HttpResponsePermanentRedirect($U, ...)
          - focus-metavariable: $U
      - patterns:
          - pattern: RedirectResponse($U, ...)
          - focus-metavariable: $U
      - patterns:
          - pattern: web.HTTPFound($U, ...)
          - focus-metavariable: $U

  - id: jgates.python.client-ip-from-forwarded-header
    message: The client address is read from a forwarding header. If the deployment does not restrict requests to trusted proxies that overwrite this header, clients can spoof it; use the connection address or confirm that this proxy protection is enforced.
    severity: INFO
    languages: [python]
    metadata:
      class: review
      category: authorization
      cwe: "CWE-348"
      subdimension: authorization
      author: JGates
      asvs_requirements: ["V15.3.4", "V4.1.3"]
    patterns:
      - pattern-either:
          - pattern: $R.headers.get($H, ...)
          - pattern: $R.headers[$H]
          - pattern: $R.META.get($H, ...)
          - pattern: $R.META[$H]
          - pattern: $R.environ.get($H, ...)
          - pattern: $R.environ[$H]
      - metavariable-regex:
          metavariable: $H
          regex: (?i)^["'](x-forwarded-for|x-real-ip|http_x_forwarded_for|http_x_real_ip|forwarded|http_forwarded)["']$

  - id: jgates.python.host-header-in-url
    message: The request's Host header is used to build an absolute URL, so a forged header can poison links, emails and redirects. Build the URL from a configured site address.
    severity: WARNING
    languages: [python]
    mode: taint
    metadata:
      category: authorization
      cwe: "CWE-644"
      subdimension: authorization
      author: JGates
      asvs_requirements: ["V4.1.3"]
    pattern-sources:
      - pattern: $R.get_host()
      - pattern: $R.headers.get("Host")
      - pattern: $R.headers["Host"]
      - pattern: $R.META["HTTP_HOST"]
      - pattern: $R.META.get("HTTP_HOST")
      - pattern: request.host
    pattern-sinks:
      - pattern: f"http://{$X}..."
      - pattern: f"https://{$X}..."
      - pattern: f"http://...{$X}..."
      - pattern: f"https://...{$X}..."
      - pattern: '"http://" + ...'
      - pattern: '"https://" + ...'
      - pattern: '"http://%s" % ...'
      - pattern: '"https://%s" % ...'
      - pattern: '"http://{}".format(...)'
      - pattern: '"https://{}".format(...)'
