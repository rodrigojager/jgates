# Signal rules of the JavaScript/TypeScript front: which technologies a project uses (jgates.js.uses-<tag>).
# They are records of the scan, never findings: they feed the "not applicable" suggestions.
# Each rule matches the import of the libraries that bring the technology into a project (ES import, require, dynamic
# import), or the typical call or global where the platform needs no dependency. Imports are syntax, so a comment or
# a string that only mentions a library does not match. They err on the side of matching: a module name that carries
# the technology's own name (any package or local file called ...saml..., ...ldap..., ...mail...) counts.
rules:
  - id: jgates.js.uses-graphql
    message: The project uses GraphQL.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      signal: graphql
      author: JGates
    patterns:
      - pattern-either:
          - pattern: import "$M"
          - pattern: import $X from "$M"
          - pattern: import * as $X from "$M"
          - pattern: import {...} from "$M"
          - pattern: import $X, {...} from "$M"
          - pattern: import $X, * as $Y from "$M"
          - pattern: import type {...} from "$M"
          - pattern: require("$M")
          - pattern: import("$M")
      - metavariable-regex:
          metavariable: $M
          regex: '^(.*graphql.*|@apollo/.+|apollo-.+|apollo|urql|@urql/.+|@nestjs/apollo|mercurius.*|relay-runtime|react-relay|gql-tada|@pothos/.+|nexus|@gqty/.+|gqty|@envelop/.+|vue-apollo|@vue/apollo-.+|.+\.(graphqls?|gql))(/.*)?$'

  - id: jgates.js.uses-websocket
    message: The project uses WebSocket.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      signal: websocket
      author: JGates
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import "$M"
              - pattern: import $X from "$M"
              - pattern: import * as $X from "$M"
              - pattern: import {...} from "$M"
              - pattern: import $X, {...} from "$M"
              - pattern: import $X, * as $Y from "$M"
              - pattern: import type {...} from "$M"
              - pattern: require("$M")
              - pattern: import("$M")
          - metavariable-regex:
              metavariable: $M
              regex: '^(.*websocket.*|ws|isomorphic-ws|socket\.io|socket\.io-.+|socket\.io/.+|@socket\.io/.+|engine\.io|engine\.io-.+|@nestjs/platform-ws|@nestjs/platform-socket\.io|uwebsockets\.js|uWebSockets\.js|sockjs|sockjs-client|@stomp/.+|faye|express-ws|koa-easy-ws|@microsoft/signalr|partysocket|rpc-websockets|subscriptions-transport-ws|@hapi/nes|primus|socketcluster|socketcluster-client|pusher-js|centrifuge|y-websocket|@hocuspocus/.+|@hono/node-ws|hono/ws|ws-.+|.+-ws)(/.*)?$'
      - pattern: new WebSocket(...)
      - pattern: new WebSocketServer(...)
      - pattern: new WebSocketStream(...)
      - pattern: new $W.WebSocket(...)
      - pattern: new $W.WebSocketServer(...)
      - pattern: new $W.Server(...)

