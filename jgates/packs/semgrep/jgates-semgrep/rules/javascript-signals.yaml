  - id: jgates.js.uses-oauth-client
    message: The project uses an OAuth or OpenID Connect client.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      signal: oauth-client
      author: JGates
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import "$M"
              - pattern: import $X from "$M"
              - pattern: import * as $X from "$M"
              - pattern: import {...} from "$M"
              - pattern: import $X, {...} from "$M"
              - pattern: import $X, * as $Y from "$M"
              - pattern: import type {...} from "$M"
              - pattern: require("$M")
              - pattern: import("$M")
          - metavariable-regex:
              metavariable: $M
              regex: '^(?!(oidc-provider|node-oidc-provider|oauth2-server|@node-oauth/|express-oauth-server|express-oauth2-server|koa-oauth-server|oauth2orize|@jmondi/oauth2-server))(.*(oauth|oidc|openid).*|next-auth|@auth/.+|google-auth-library|googleapis|@azure/msal-.+|msal|auth0-js|auth0|@auth0/.+|grant|grant-.+|arctic|@badgateway/oauth2-client|@okta/.+|keycloak-js|keycloak-connect|@react-keycloak/.+|expo-auth-session|react-native-app-auth|passport-(google|github|facebook|twitter|microsoft|azure|apple|discord|linkedin|slack|spotify|gitlab|bitbucket|amazon|auth0|okta|keycloak|steam|twitch).*|@supabase/supabase-js|@supabase/auth-.+|@supabase/ssr|firebase/auth|@firebase/auth|@clerk/.+|@kinde-oss/.+|@descope/.+|@workos-inc/.+|@stytch/.+|@fusionauth/.+|@logto/.+|aws-amplify|aws-amplify/auth|@aws-amplify/auth|amazon-cognito-identity-js|better-auth|better-auth/.+|lucia|remix-auth|remix-auth-.+|angular-auth-oidc-client|@octokit/auth-.+|@react-oauth/.+|@azure/identity)(/.*)?$'
      - pattern: new OAuth2Client(...)
      - pattern: new OAuth2(...)
      - pattern: new OAuth(...)
      - pattern: new $X.OAuth2(...)
      - pattern: |
          {..., grant_type: $V, ...}
      - pattern: |
          {..., "grant_type": $V, ...}
      - pattern: |
          {..., response_type: $V, ...}
      - pattern: |
          {..., "response_type": $V, ...}

