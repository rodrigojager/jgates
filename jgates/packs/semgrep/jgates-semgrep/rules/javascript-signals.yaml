          - metavariable-regex:
              metavariable: $M
              regex: '^(.*webrtc.*|simple-peer|peerjs|peerjs-.+|wrtc|@roamhq/wrtc|node-datachannel|werift|@werift/.+|mediasoup|mediasoup-.+|livekit-client|livekit-server-sdk|@livekit/.+|twilio-video|@daily-co/.+|agora-rtc-sdk-ng|agora-rtc-react|openvidu-browser|sip\.js|jssip|kurento-client|janode|opentok|@opentok/.+|trystero|y-webrtc|@100mslive/.+|@whereby\.com/.+|@jitsi/.+|lib-jitsi-meet|@stream-io/video-.+)(/.*)?$'
      - pattern: new RTCPeerConnection(...)
