# Group passwords-sessions for JavaScript and TypeScript.
# Libraries covered: Joi, zod, yup (schema chains), Mongoose and Sequelize field options, express-validator, validator.js,
# class-validator decorators, hand-written length checks, password-validator, bcrypt, bcryptjs, argon2, Node crypto,
# JSX inputs and DOM or jQuery paste handlers, express-session (and Fastify sessions) logins, speakeasy, otplib and otpauth.
# Sources of the taint rules: req.query, req.body, req.params, req.headers, req.cookies and the Koa request (ctx.request.body,
# ctx.query, ctx.params).
rules:
  - id: jgates.js.password-min-length-below-8
    message: A password validator accepts passwords shorter than 8 characters. Require a minimum length of at least 8 (15 when the password is the only factor).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.1"]
    pattern-either:
      - patterns:
          - pattern: '{..., $K: <... $O.min($N, ...) ...>, ...}'
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^(?!.*(length|min|max|hash|salt|policy|expir|attempt|history|count|rounds)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^[2-7]$
          - focus-metavariable: $N
      - patterns:
          - pattern-either:
              - pattern: '{..., $K: {..., minlength: $N, ...}, ...}'
              - pattern: '{..., $K: {..., minLength: $N, ...}, ...}'
              - pattern: '{..., $K: {..., validate: {..., len: [$N, ...], ...}, ...}, ...}'
              - pattern: '{..., $K: {..., isLength: {..., options: {..., min: $N, ...}, ...}, ...}, ...}'
              - pattern: '{..., $K: {..., isLength: {..., options: [$N, ...], ...}, ...}, ...}'
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^(?!.*(length|min|max|hash|salt|policy|expir|attempt|history|count|rounds)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^[2-7]$
          - focus-metavariable: $N
      - patterns:
          - pattern-either:
              - pattern: '$F($P, ...). ... .isLength({..., min: $N, ...})'
              - pattern: $F($P, ...). ... .isLength($N, ...)
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^["'`][^"'`]*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^[2-7]$
          - focus-metavariable: $N
      - patterns:
          - pattern: '$V.isLength($P, {..., min: $N, ...})'
          - metavariable-regex:
              metavariable: $P
              regex: (?is).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^[2-7]$
          - focus-metavariable: $N
      - patterns:
          - pattern: |
              class $C {
                ...
                @MinLength($N, ...)
                $P: $T;
                ...
              }
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^(?!.*(length|min|max|hash|salt|policy|expir|attempt|history|count|rounds)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^[2-7]$
          - focus-metavariable: $N
      - patterns:
          - pattern-either:
              - pattern: $P.length < $N
              - pattern: $P.length >= $N
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^(?!.*(hash|salt)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^[2-7]$
          - focus-metavariable: $N
      - patterns:
          - pattern-either:
              - pattern: $P.length <= $N
              - pattern: $P.length > $N
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^(?!.*(hash|salt)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^[2-6]$
          - focus-metavariable: $N

  - id: jgates.js.password-max-length-below-64
    message: A password validator rejects passwords longer than a literal limit under 64 characters. Allow at least 64 characters, and hash the password rather than capping it.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.9"]
    pattern-either:
      - patterns:
          - pattern: '{..., $K: <... $O.max($N, ...) ...>, ...}'
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^(?!.*(length|min|max|hash|salt|policy|expir|attempt|history|count|rounds)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^([1-9]|[1-5][0-9]|6[0-3])$
          - focus-metavariable: $N
      - patterns:
          - pattern-either:
              - pattern: '{..., $K: {..., maxlength: $N, ...}, ...}'
              - pattern: '{..., $K: {..., maxLength: $N, ...}, ...}'
              - pattern: '{..., $K: {..., validate: {..., len: [$MIN, $N], ...}, ...}, ...}'
              - pattern: '{..., $K: {..., isLength: {..., options: {..., max: $N, ...}, ...}, ...}, ...}'
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^(?!.*(length|min|max|hash|salt|policy|expir|attempt|history|count|rounds)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^([1-9]|[1-5][0-9]|6[0-3])$
          - focus-metavariable: $N
      - patterns:
          - pattern: '$F($P, ...). ... .isLength({..., max: $N, ...})'
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^["'`][^"'`]*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^([1-9]|[1-5][0-9]|6[0-3])$
          - focus-metavariable: $N
      - patterns:
          - pattern: '$V.isLength($P, {..., max: $N, ...})'
          - metavariable-regex:
              metavariable: $P
              regex: (?is).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^([1-9]|[1-5][0-9]|6[0-3])$
          - focus-metavariable: $N
      - patterns:
          - pattern: |
              class $C {
                ...
                @MaxLength($N, ...)
                $P: $T;
                ...
              }
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^(?!.*(length|min|max|hash|salt|policy|expir|attempt|history|count|rounds)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^([1-9]|[1-5][0-9]|6[0-3])$
          - focus-metavariable: $N
      - patterns:
          - pattern: $P.length > $N
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^(?!.*(hash|salt)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^([89]|[1-5][0-9]|6[0-3])$
          - focus-metavariable: $N
      - patterns:
          - pattern: $P.length >= $N
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^(?!.*(hash|salt)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $N
              regex: ^([89]|[1-5][0-9]|6[0-4])$
          - focus-metavariable: $N

  - id: jgates.js.password-composition-rule
    message: A password policy demands character classes (upper case, digits or symbols), which pushes users to predictable passwords. Check the length and screen against known breached passwords instead.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.5"]
    pattern-either:
      - patterns:
          - pattern: '$V.isStrongPassword(..., {..., $R: $N, ...})'
          - metavariable-regex:
              metavariable: $R
              regex: ^(minLowercase|minUppercase|minNumbers|minSymbols)$
          - metavariable-regex:
              metavariable: $N
              regex: ^[1-9]
      - patterns:
          - pattern: $S.has().$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(uppercase|lowercase|digits|symbols)$
      - patterns:
          - pattern: '{..., $K: <... $O.$M($R, ...) ...>, ...}'
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^(?!.*(length|min|max|hash|salt|policy|expir|attempt|history|count|rounds)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $M
              regex: ^(matches|regex|pattern|match)$
          - metavariable-regex:
              metavariable: $R
              regex: ^/.*\(\?=\.\*
          - focus-metavariable: $R
      - patterns:
          - pattern: $F($P, ...). ... .matches($R, ...)
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^["'`][^"'`]*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $R
              regex: ^/.*\(\?=\.\*

  - id: jgates.js.password-transformed-before-verify
    message: A password is lower-cased, upper-cased or cut before it is hashed or compared. Hash and verify the password exactly as the user typed it.
    severity: WARNING
    languages: [javascript, typescript]
    mode: taint
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.8"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $P.toLowerCase()
              - pattern: $P.toUpperCase()
              - pattern: $P.toLocaleLowerCase(...)
              - pattern: $P.toLocaleUpperCase(...)
              - pattern: $P.slice(...)
              - pattern: $P.substring(...)
              - pattern: $P.substr(...)
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^(?!.*(hash|salt)).*(password|passwd|pwd|passphrase|senha)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $L.$M($X, ...)
              - pattern: $L.$M($X, ...).$N(...)
          - metavariable-regex:
              metavariable: $L
              regex: ^(bcrypt|bcryptjs|argon2|scrypt|bcrypt\.default)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(hash|hashSync|compare|compareSync|verify)$
          - focus-metavariable: $X
      - patterns:
          - pattern: crypto.createHash(...).update($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: crypto.pbkdf2($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: crypto.pbkdf2Sync($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: crypto.scryptSync($X, ...)
          - focus-metavariable: $X

  - id: jgates.js.password-field-not-masked
    message: An input named like a password explicitly uses an unmasked type, so what the user types is shown on screen. Use type="password" (a show/hide toggle may switch the type on demand).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: authentication
      cwe: "CWE-549"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.6"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: <input ... name="$N" ... type="$T" ... />
              - pattern: <input ... id="$N" ... type="$T" ... />
              - pattern: <$C ... name="$N" ... type="$T" ... />
          - metavariable-regex:
              metavariable: $N
              regex: (?i)^(?!.*(show|toggle|reveal|visible|hide|remember|forgot|hint|policy)).*(password|passwd|pwd|passphrase|senha)
          - metavariable-regex:
              metavariable: $T
              regex: (?i)^(?!password$|checkbox$|radio$|hidden$|submit$|button$|reset$)
  - id: jgates.js.password-field-not-masked-by-default
    message: An input named like a password has no visible type and defaults to unmasked text. Set type="password" here or confirm where the password type is applied before the field is displayed.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: authentication
      cwe: "CWE-549"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.6"]
      class: review
    patterns:
      - pattern: <input ... name="$N" ... />
      - pattern-not: <input ... type=... ... />
      - pattern-not: <input ... {...$REST} ... />
      - metavariable-regex:
          metavariable: $N
          regex: (?i)^(?!.*(show|toggle|reveal|visible|hide|remember|forgot|hint|policy)).*(password|passwd|pwd|passphrase|senha)

  - id: jgates.js.password-paste-blocked
    message: Pasting into a password field is blocked, or autocomplete is switched off on it, which stops password managers. Let the field accept paste and use autocomplete="current-password" or "new-password".
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: authentication
      cwe: "CWE-1390"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.7"]
    pattern-either:
      - patterns:
          - pattern: <$C ... type="password" ... onPaste={$H} ... />
          - metavariable-regex:
              metavariable: $H
              regex: (?s).*(preventDefault\(\)|return\s+false|=>\s*false\s*$)
      - patterns:
          - pattern: <$C ... type="password" ... autoComplete="off" ... />
      - patterns:
          - pattern-either:
              - pattern: $EL.addEventListener("paste", $H, ...)
              - pattern: $EL.onpaste = $H
              - pattern: $EL.on("paste", $H)
              - pattern: $EL.bind("paste", $H)
          - metavariable-regex:
              metavariable: $H
              regex: (?s).*(preventDefault\(\)|return\s+false|=>\s*false\s*$)
          - metavariable-regex:
              metavariable: $EL
              regex: (?is).*(password|passwd|pwd|senha)
      - patterns:
          - pattern-either:
              - pattern: $EL.setAttribute("autocomplete", "off")
              - pattern: $EL.autocomplete = "off"
          - metavariable-regex:
              metavariable: $EL
              regex: (?is).*(password|passwd|pwd|senha)

  - id: jgates.js.session-id-not-regenerated
    message: A login writes the identity into the session without visible session identifier renewal. If nothing else renews it, session fixation may be possible; call req.session.regenerate and set the identity inside its callback, or confirm where renewal occurs.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: session
      cwe: "CWE-384"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V7.2.4"]
      class: review
    patterns:
      - pattern: $REQ.session.$K = $V
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^(user|userId|user_id|uid|isAuthenticated|authenticated|loggedIn|isLoggedIn|accountId)$
      - pattern-not: $REQ.session.$K = null
      - pattern-not: $REQ.session.$K = undefined
      - pattern-not: $REQ.session.$K = false
      - pattern-not-inside: $REQ.session.regenerate(...)
      - pattern-not-inside: |
          function $F(...) {
            ...
            $REQ.session.regenerate(...)
            ...
          }
      - pattern-not-inside: |
          function (...) {
            ...
            $REQ.session.regenerate(...)
            ...
          }
      - pattern-not-inside: |
          (...) => {
            ...
            $REQ.session.regenerate(...)
            ...
          }

  - id: jgates.js.client-controlled-privilege
    message: A role, admin flag or permission field is assigned from data the client sends. Derive privileges on the server (from the stored user or an allow-list) and never copy them from the request.
    severity: WARNING
    languages: [javascript, typescript]
    mode: taint
    metadata:
      category: authorization
      cwe: "CWE-639"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.3.1"]
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
      - pattern: ctx.request.body
      - pattern: ctx.query
      - pattern: ctx.params
    pattern-sinks:
      - patterns:
          - pattern: $U.$F = $V
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(role|roles|userRole|user_role|isAdmin|is_admin|admin|isSuperuser|is_superuser|isStaff|is_staff|permission|permissions|scope|scopes|accessLevel|access_level|privilege|privileges)$
          - focus-metavariable: $V
      - patterns:
          - pattern: '{..., $K: $V, ...}'
          - pattern-not-inside: const {...} = $E
          - pattern-not-inside: let {...} = $E
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'`]?(role|roles|userRole|user_role|isAdmin|is_admin|admin|isSuperuser|is_superuser|isStaff|is_staff|permission|permissions|scope|scopes|accessLevel|access_level|privilege|privileges)["'`]?$
          - focus-metavariable: $V

  - id: jgates.js.totp-window-too-wide
    message: A one-time password check accepts a step longer than 30 seconds or a window wider than one step on each side, which widens the time an intercepted code stays valid. Use a 30-second step and a window of at most 1.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: authentication
      cwe: "CWE-307"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.5.5"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: 'speakeasy.totp.verify({..., window: $W, ...})'
              - pattern: '$T.validate({..., token: $X, window: $W, ...})'
              - pattern: '$A.options = {..., window: $W, ...}'
              - pattern: '$A.resetOptions({..., window: $W, ...})'
          - metavariable-regex:
              metavariable: $W
              regex: ^([2-9]|[1-9][0-9]+)$
          - focus-metavariable: $W
      - patterns:
          - pattern-either:
              - pattern: 'speakeasy.totp({..., step: $S, ...})'
              - pattern: 'speakeasy.totp.verify({..., step: $S, ...})'
              - pattern: '$A.options = {..., step: $S, ...}'
              - pattern: 'new $T({..., period: $S, ...})'
              - pattern: 'new $NS.TOTP({..., period: $S, ...})'
          - metavariable-regex:
              metavariable: $S
              regex: ^(3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})$
          - focus-metavariable: $S

  - id: jgates.js.secret-question-present
    message: A field or model is named as a secret question or its answer. Knowledge-based recovery questions are guessable; use a one-time code sent to the user or another strong factor instead.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: authentication
      cwe: "CWE-640"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.4.2"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: '{..., $K: $V, ...}'
              - pattern: $O.$K
              - pattern: const $K = $V
              - pattern: let $K = $V
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'`]?(secret|security|recovery)[-_ ]?(question|answer)s?["'`]?$
          - focus-metavariable: $K
      - patterns:
          - pattern: <$C ... name="$N" ... />
          - metavariable-regex:
              metavariable: $N
              regex: (?i)^(secret|security|recovery)[-_ ]?(question|answer)s?$
