# Signal rules of the PHP front: which technologies a project uses (jgates.php.uses-<tag>).
# They are records of the scan, never findings: they feed the "not applicable" suggestions.
# Each rule matches the import (use) of the libraries that bring the technology into a PHP project, the class used by
# name (new, static call, extends) and the typical standard-library call where no dependency is needed. Imports and
# calls are syntax, so a comment or a string that only mentions a library does not match. The tags "latex" and
# "browser-dom" have no signal in PHP: no library is common enough to list with confidence, and PHP does not run in a
# browser.
rules:
  - id: jgates.php.uses-graphql
    message: The project uses GraphQL.
    severity: INFO
    languages: [php]
    metadata:
      signal: graphql
      author: JGates
    pattern-either:
      - patterns:
          - pattern: use $M;
          - metavariable-regex:
              metavariable: $M
              regex: '^\\?((GraphQL|Rebing\\GraphQL|Nuwave\\Lighthouse|Overblog\\GraphQLBundle|Overblog\\GraphQL|ApiPlatform\\GraphQl|TheCodingMachine\\GraphQLite|Youshido\\GraphQL|Siler\\GraphQL|Spawnia\\Sailor|Graphpinator|Softonic\\GraphQL|Gmostafa\\GraphqlClient|Drupal\\graphql|MLL\\GraphQLScalars|Ecodev\\Felix\\GraphQL|Lighthouse|Siler\\Graphql)(\\.*)?|WPGraphQL|WPGraphQL_[A-Za-z_]*)$'
      - patterns:
          - pattern: new $C(...)
          - metavariable-regex:
              metavariable: $C
              regex: '^\\?((GraphQL|Rebing\\GraphQL|Nuwave\\Lighthouse|Overblog\\GraphQLBundle|Overblog\\GraphQL|ApiPlatform\\GraphQl|TheCodingMachine\\GraphQLite|Youshido\\GraphQL|Siler\\GraphQL|Spawnia\\Sailor|Graphpinator|Softonic\\GraphQL|Gmostafa\\GraphqlClient|Drupal\\graphql|MLL\\GraphQLScalars|Ecodev\\Felix\\GraphQL|Lighthouse|Siler\\Graphql)(\\.*)?|WPGraphQL|WPGraphQL_[A-Za-z_]*)$'
      - patterns:
