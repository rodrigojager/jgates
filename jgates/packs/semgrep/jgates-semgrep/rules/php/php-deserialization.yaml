# Original JGates rules. Intra-procedural request sources: PHP superglobals,
# Laravel request() and $request/$req input/query/post/cookie/file methods,
# Symfony $request/$req get() and query/request/cookies/files/headers bags.
# Object sources intentionally require the conventional request/req variable name.
# Only request-controlled $_SERVER keys are sources, not server configuration.
rules:
  - id: jgates.php.unsafe-deserialization
    message: Request data reaches native PHP deserialization. Prefer JSON decoded into data structures and validate its schema.
    severity: ERROR
    languages: [php]
    mode: taint
    metadata:
      category: deserialization
      cwe: "CWE-502"
      author: JGates
      subdimension: injection
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
      - pattern: $_FILES[...]
      - patterns:
          - pattern: $_SERVER[$KEY]
          - metavariable-regex:
              metavariable: $KEY
              regex: ^["']?(HTTP_.*|REQUEST_URI|QUERY_STRING|PATH_INFO)["']?$
      - pattern: request()->input(...)
      - pattern: request()->query(...)
      - pattern: request()->post(...)
      - pattern: request()->cookie(...)
      - pattern: request()->file(...)
      - patterns:
          - pattern-either:
              - pattern: $REQUEST->input(...)
              - pattern: $REQUEST->query(...)
              - pattern: $REQUEST->post(...)
              - pattern: $REQUEST->cookie(...)
              - pattern: $REQUEST->file(...)
              - pattern: $REQUEST->get(...)
              - pattern: $REQUEST->query->get(...)
              - pattern: $REQUEST->request->get(...)
              - pattern: $REQUEST->cookies->get(...)
              - pattern: $REQUEST->files->get(...)
              - pattern: $REQUEST->headers->get(...)
          - metavariable-regex:
              metavariable: $REQUEST
              regex: ^\$(request|req)$
    pattern-sinks:
      - pattern: "unserialize($DATA, ...)"
        focus-metavariable: $DATA

