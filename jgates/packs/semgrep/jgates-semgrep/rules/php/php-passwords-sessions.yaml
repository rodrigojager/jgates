# Password policy, session renewal, client-controlled privilege and one-time passwords for PHP.
# Libraries covered: Laravel validation (rule strings and arrays, Illuminate Password rule, Gate::before),
# Symfony forms and the Validator Length and Regex constraints, native strlen/mb_strlen checks, password_hash,
# password_verify, Laravel Hash and bcrypt, native $_SESSION and session_regenerate_id, Spatie permission
# methods, OTPHP TOTP, RobThree TwoFactorAuth and PragmaRX Google2FA. The analysis stays inside one function.
# Password-like names: password, passwd, pwd, passphrase, senha. Request sources are the ones of php-taint.yaml.
rules:
  - id: jgates.php.password-min-length-below-8
    message: A password validator accepts passwords shorter than 8 characters. Require a minimum of at least 8 (Password::min(8) in Laravel, a Length constraint with a minimum of 8 in Symfony).
    severity: ERROR
    languages: [php]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.1"]
    pattern-either:
      - patterns:
          - pattern: "[..., $K => $V, ...]"
          - focus-metavariable: $V
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'](?!.*(current|old|confirm))[\w.*-]*(password|passwd|pwd|passphrase|senha)[\w.*-]*["']$
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["'](?:[^"'|]*\|)*min:[0-7](?:\|[^"']*)?["']$
      - patterns:
          - pattern: "[..., $K => [..., $V, ...], ...]"
          - focus-metavariable: $V
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'](?!.*(current|old|confirm))[\w.*-]*(password|passwd|pwd|passphrase|senha)[\w.*-]*["']$
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["']min:[0-7]["']$
      - patterns:
          - pattern: Password::min($N)
          - metavariable-regex:
              metavariable: $N
              regex: ^[0-7]$
      - patterns:
          - pattern-either:
              - pattern: new Length([..., 'min' => $N, ...])
              - pattern: new Length([..., "min" => $N, ...])
              - pattern: "new Length(..., min: $N, ...)"
              - pattern: new Assert\Length([..., 'min' => $N, ...])
              - pattern: "new Assert\\Length(..., min: $N, ...)"
          - pattern-inside: $B->add($F, ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^["'](?!.*(current|old|confirm))[\w.*-]*(password|passwd|pwd|passphrase|senha)[\w.*-]*["']$
          - metavariable-regex:
              metavariable: $N
              regex: ^[0-7]$
      - patterns:
          - pattern-either:
              - pattern: strlen($PW) < $N
              - pattern: mb_strlen($PW) < $N
              - pattern: strlen($PW) >= $N
              - pattern: mb_strlen($PW) >= $N
          - metavariable-regex:
              metavariable: $PW
              regex: (?i)^\$?[\w\[\]'"-]*(password|passwd|pwd|passphrase|senha)[\w\[\]'"-]*$
          - metavariable-regex:
              metavariable: $N
              regex: ^[0-7]$
      - patterns:
          - pattern-either:
              - pattern: strlen($PW) <= $N
              - pattern: mb_strlen($PW) <= $N
              - pattern: strlen($PW) > $N
              - pattern: mb_strlen($PW) > $N
          - metavariable-regex:
              metavariable: $PW
              regex: (?i)^\$?[\w\[\]'"-]*(password|passwd|pwd|passphrase|senha)[\w\[\]'"-]*$
          - metavariable-regex:
              metavariable: $N
              regex: ^[0-6]$

  - id: jgates.php.password-max-length-below-64
    message: A password validator rejects passwords longer than a limit under 64 characters. Allow at least 64 characters, and truncate nothing, so that passphrases and password-manager values are accepted.
    severity: WARNING
    languages: [php]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.9"]
    pattern-either:
      - patterns:
          - pattern: "[..., $K => $V, ...]"
          - focus-metavariable: $V
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'](?!.*(current|old|confirm))[\w.*-]*(password|passwd|pwd|passphrase|senha)[\w.*-]*["']$
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["'](?:[^"'|]*\|)*max:(?:[0-9]|[1-5][0-9]|6[0-3])(?:\|[^"']*)?["']$
      - patterns:
          - pattern: "[..., $K => [..., $V, ...], ...]"
          - focus-metavariable: $V
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'](?!.*(current|old|confirm))[\w.*-]*(password|passwd|pwd|passphrase|senha)[\w.*-]*["']$
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["']max:(?:[0-9]|[1-5][0-9]|6[0-3])["']$
      - patterns:
          - pattern-either:
              - pattern: new Length([..., 'max' => $N, ...])
              - pattern: new Length([..., "max" => $N, ...])
              - pattern: "new Length(..., max: $N, ...)"
              - pattern: new Assert\Length([..., 'max' => $N, ...])
              - pattern: "new Assert\\Length(..., max: $N, ...)"
          - pattern-inside: $B->add($F, ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^["'](?!.*(current|old|confirm))[\w.*-]*(password|passwd|pwd|passphrase|senha)[\w.*-]*["']$
          - metavariable-regex:
              metavariable: $N
              regex: ^(?:[0-9]|[1-5][0-9]|6[0-3])$
      - patterns:
          - pattern-either:
              - pattern: strlen($PW) > $N
              - pattern: mb_strlen($PW) > $N
          - metavariable-regex:
              metavariable: $PW
              regex: (?i)^\$?[\w\[\]'"-]*(password|passwd|pwd|passphrase|senha)[\w\[\]'"-]*$
          - metavariable-regex:
              metavariable: $N
              regex: ^(?:[0-9]|[1-5][0-9]|6[0-3])$
      - patterns:
          - pattern-either:
              - pattern: strlen($PW) >= $N
              - pattern: mb_strlen($PW) >= $N
          - metavariable-regex:
              metavariable: $PW
              regex: (?i)^\$?[\w\[\]'"-]*(password|passwd|pwd|passphrase|senha)[\w\[\]'"-]*$
          - metavariable-regex:
              metavariable: $N
              regex: ^(?:[0-9]|[1-5][0-9]|6[0-4])$

  - id: jgates.php.password-composition-rule
    message: The password policy demands character classes (upper case, digits, symbols). Composition rules push users to predictable passwords; prefer a length minimum and a breached-password check such as Password::min(8)->uncompromised().
    severity: INFO
    languages: [php]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.5"]
    pattern-either:
      - pattern-regex: (?s)\bPassword::\w+\([^()]*\)(?:\s*->\s*\w+\([^()]*\))*?\s*->\s*(?:mixedCase|numbers|symbols|letters)\(\s*\)
      - patterns:
          - pattern: "[..., $K => $V, ...]"
          - focus-metavariable: $V
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'][\w.*-]*(password|passwd|pwd|passphrase|senha)[\w.*-]*["']$
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["'](?:[^"'|]*\|)*regex:.*\(\?=\.\*.*["']$
      - patterns:
          - pattern: "[..., $K => [..., $V, ...], ...]"
          - focus-metavariable: $V
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'][\w.*-]*(password|passwd|pwd|passphrase|senha)[\w.*-]*["']$
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["']regex:.*\(\?=\.\*.*["']$
      - patterns:
          - pattern-either:
              - pattern: new Regex($P)
              - pattern: new Regex([..., 'pattern' => $P, ...])
              - pattern: new Assert\Regex($P)
              - pattern: new Assert\Regex([..., 'pattern' => $P, ...])
          - pattern-inside: $B->add($F, ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^["'][\w.*-]*(password|passwd|pwd|passphrase|senha)[\w.*-]*["']$
          - metavariable-regex:
              metavariable: $P
              regex: (?s)^.*\(\?=\.\*
      - patterns:
          - pattern: preg_match($P, $PW)
          - metavariable-regex:
              metavariable: $PW
              regex: (?i)^\$?[\w\[\]'"-]*(password|passwd|pwd|passphrase|senha)[\w\[\]'"-]*$
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^["']/(?:.*\(\?=\.\*.*|\[(?:A-Z|a-z|0-9)\]|\\d|\\W)/[a-z]*["']$

  - id: jgates.php.password-transformed-before-verify
    message: The password is lower-cased, upper-cased or cut before it is hashed or compared. Hash and verify the value exactly as the user typed it, so that no entropy is lost and every user's password is checked the same way.
    severity: WARNING
    languages: [php]
    metadata:
      category: authentication
      cwe: "CWE-521"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.2.8"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: password_hash($F($PW, ...), ...)
              - pattern: password_verify($F($PW, ...), ...)
              - pattern: crypt($F($PW, ...), ...)
              - pattern: Hash::make($F($PW, ...), ...)
              - pattern: Hash::check($F($PW, ...), ...)
              - pattern: bcrypt($F($PW, ...), ...)
              - pattern: hash_equals($F($PW, ...), ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(strtolower|strtoupper|mb_strtolower|mb_strtoupper|substr|mb_substr|mb_strcut)$
          - metavariable-regex:
              metavariable: $PW
              regex: (?is)^.*(password|passwd|pwd|passphrase|senha).*$
      - patterns:
          - pattern: $PW = $F($PW, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(strtolower|strtoupper|mb_strtolower|mb_strtoupper|substr|mb_substr|mb_strcut)$
          - metavariable-regex:
              metavariable: $PW
              regex: (?i)^\$[\w]*(password|passwd|pwd|passphrase|senha)[\w]*$

  - id: jgates.php.session-id-not-regenerated
    message: A login writes the identity into $_SESSION without visible session identifier renewal. If no framework or login helper renews it, a session id fixed before login can remain valid; call session_regenerate_id(true) after verifying credentials or confirm where equivalent renewal occurs.
    severity: INFO
    languages: [php]
    metadata:
      class: review
      category: session
      cwe: "CWE-384"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V7.2.4"]
    patterns:
      - pattern-either:
          - pattern: $_SESSION[$K] = $V;
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^["']?[\w]*(user|uid|auth|login|logged|account|member|role|admin|identity)[\w]*["']?$
      - pattern-either:
          - pattern-inside: |
              if (<... password_verify(...) ...>) {
                ...
              }
          - pattern-inside: |
              if (<... Hash::check(...) ...>) {
                ...
              }
      - pattern-not-inside: |
          if (<... password_verify(...) ...>) {
            ...
            session_regenerate_id(...);
            ...
          }
      - pattern-not-inside: |
          if (<... Hash::check(...) ...>) {
            ...
            session_regenerate_id(...);
            ...
          }
      - pattern-not-inside: |
          function $F(...) {
            ...
            session_regenerate_id(...);
            ...
          }

  - id: jgates.php.client-controlled-privilege
    message: A role, admin flag or permission is assigned from request data, so the caller picks their own privileges. Decide the privilege on the server (a fixed role, a lookup in an administrator-only action) and never copy it from the request.
    severity: WARNING
    languages: [php]
    mode: taint
    metadata:
      category: authorization
      cwe: "CWE-639"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.3.1"]
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
      - patterns:
          - pattern: $_SERVER[$KEY]
          - metavariable-regex:
              metavariable: $KEY
              regex: ^["']?(HTTP_.*|REQUEST_URI|QUERY_STRING|PATH_INFO)["']?$
      - pattern: request()->input(...)
      - pattern: request()->query(...)
      - pattern: request()->post(...)
      - pattern: request()->cookie(...)
      - patterns:
          - pattern-either:
              - pattern: $REQUEST->input(...)
              - pattern: $REQUEST->query(...)
              - pattern: $REQUEST->post(...)
              - pattern: $REQUEST->cookie(...)
              - pattern: $REQUEST->get(...)
              - pattern: $REQUEST->query->get(...)
              - pattern: $REQUEST->request->get(...)
              - pattern: $REQUEST->cookies->get(...)
              - pattern: $REQUEST->headers->get(...)
          - metavariable-regex:
              metavariable: $REQUEST
              regex: ^\$(request|req)$
    pattern-sinks:
      - patterns:
          - pattern: $OBJ->$P = $S
          - focus-metavariable: $S
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^(role|roles|is_?admin|admin|is_?staff|is_?super_?user|superuser|permissions?|privileges?|user_?type|access_?level|is_?moderator)$
      - patterns:
          - pattern: $_SESSION[$K] = $S
          - focus-metavariable: $S
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["']?(role|roles|is_?admin|admin|is_?staff|is_?super_?user|superuser|permissions?|privileges?|user_?type|access_?level|is_?moderator)["']?$
      - patterns:
          - pattern: "[..., $K => $S, ...]"
          - focus-metavariable: $S
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'](role|roles|is_?admin|admin|is_?staff|is_?super_?user|superuser|permissions?|privileges?|user_?type|access_?level|is_?moderator)["']$
      - patterns:
          - pattern-either:
              - pattern: $U->assignRole($S)
              - pattern: $U->syncRoles($S)
              - pattern: $U->givePermissionTo($S)
              - pattern: $U->syncPermissions($S)
              - pattern: $U->setRole($S)
              - pattern: $U->setRoles($S)
          - focus-metavariable: $S

  - id: jgates.php.permit-all-requests
    message: A global authorization callback always returns true, so every ability is granted to every caller. Return true only for a specific, verified user (for example a super administrator) and null otherwise, so that the policies still run.
    severity: WARNING
    languages: [php]
    metadata:
      category: authorization
      cwe: "CWE-862"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V8.2.1"]
    pattern-either:
      - pattern-regex: \bGate::before\(\s*(?:static\s+)?fn\s*\([^)]*\)\s*(?::\s*[\w?|\\]+\s*)?=>\s*true\s*\)
      - pattern-regex: \bGate::before\(\s*(?:static\s+)?function\s*\([^)]*\)\s*(?:use\s*\([^)]*\)\s*)?(?::\s*[\w?|\\]+\s*)?\{\s*return\s+true\s*;\s*\}\s*\)

  - id: jgates.php.totp-window-too-wide
    message: A one-time password library is configured with a step longer than 30 seconds or accepts more than one step on each side, which widens the time an intercepted code stays valid. Use a 30-second period and at most one step of tolerance.
    severity: WARNING
    languages: [php]
    metadata:
      category: authentication
      cwe: "CWE-307"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.5.5"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: TOTP::create($S, $P, ...)
              - pattern: "new TwoFactorAuth(..., period: $P, ...)"
              - pattern: new TwoFactorAuth("...", $D, $P, ...)
              - pattern: $G->setKeyRegeneration($P)
          - metavariable-regex:
              metavariable: $P
              regex: ^(?:3[1-9]|[4-9][0-9]|[1-9][0-9]{2,})$
      - patterns:
          - pattern-either:
              - pattern: $T->verifyCode($S, $C, $W, ...)
              - pattern: $G->verifyKey($S, $C, $W, ...)
              - pattern: $G->verifyKeyNewer($S, $C, $O, $W, ...)
              - pattern: $G->setWindow($W)
          - metavariable-regex:
              metavariable: $W
              regex: ^(?:[2-9]|[1-9][0-9]+)$

  - id: jgates.php.secret-question-present
    message: The code stores or asks a secret question and its answer. Knowledge-based answers are guessable and easy to research; remove them and recover accounts through a verified channel instead.
    severity: INFO
    languages: [php]
    metadata:
      category: authentication
      cwe: "CWE-640"
      author: JGates
      subdimension: authorization
      asvs_requirements: ["V6.4.2"]
    pattern-regex: (?i)(?:['"$]|->)(?:secret|security)_?(?:question|answer)s?\b
