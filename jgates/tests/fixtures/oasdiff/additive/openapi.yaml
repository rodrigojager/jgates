openapi: 3.0.3
info:
  title: Users API
  version: 1.1.0
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  displayName:
                    type: string
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Alive
