server {
    listen 443 ssl;
    server_name app.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_cookie_flags ~ nosecure nohttponly;
        more_clear_headers 'X-Content-Type-Options';
        add_header Strict-Transport-Security "max-age=86400" always;
    }
}
