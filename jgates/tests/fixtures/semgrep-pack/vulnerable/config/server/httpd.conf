ServerRoot "/etc/httpd"
Listen 443

ServerTokens Full
ServerSignature On
TraceEnable On

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/example.pem
    SSLCertificateKeyFile /etc/ssl/private/example.key
    SSLProtocol all -SSLv3
    SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA384:DES-CBC3-SHA
</VirtualHost>
