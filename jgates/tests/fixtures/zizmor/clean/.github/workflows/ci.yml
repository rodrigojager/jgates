name: ci
on:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Echo the issue title safely
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "ref $REF_NAME"
