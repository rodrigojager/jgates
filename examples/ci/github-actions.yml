# .github/workflows/jgates.yml (in the project repository)
# Store the fingerprint in a protected repository variable: JGATES_POLICY_SHA256 = <policy-sha256>
name: JGates
on: [pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  jgates:
    runs-on: ubuntu-latest
    # The job runs inside the JGates tools image, pinned by digest: every tool is already there, nothing is installed.
    container: <registry>/jgates-tools@sha256:<digest>
    env:
      JGATES_POLICY_DIR: ${{ github.workspace }}/policy
      JGATES_POLICY_SHA256: ${{ vars.JGATES_POLICY_SHA256 }}
      # The digest of the container above (a policy with execution.extensionImage: pinned compares it with the pin).
      JGATES_TOOLS_IMAGE_DIGEST: sha256:<digest>
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: <organization>/<policy-repository>
          ref: main
          path: policy
          token: ${{ secrets.POLICY_REPOSITORY_TOKEN }}
      - run: jgates ci --policy "$JGATES_POLICY_DIR" --sarif jgates.sarif
        working-directory: project
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: project/jgates.sarif
