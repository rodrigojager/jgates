# .gitlab-ci.yml (in the project repository)
# Store the fingerprint in a protected CI/CD variable: JGATES_POLICY_SHA256 = <policy-sha256>
jgates:
  stage: test
  # The job runs inside the JGates tools image, pinned by digest: every tool is already there, nothing is installed.
  image: <registry>/jgates-tools@sha256:<digest>
  variables:
    GIT_DEPTH: "0"
    # Outside $CI_PROJECT_DIR: a policy inside the analyzed project is refused (POLICY_INSIDE_PROJECT).
    JGATES_POLICY_DIR: "$CI_BUILDS_DIR/jgates-policy-$CI_JOB_ID"
    # The digest of the image above (a policy with execution.extensionImage: pinned compares it with the pin).
    JGATES_TOOLS_IMAGE_DIGEST: "sha256:<digest>"
  script:
    - git clone --depth 1 --branch main "https://gitlab-ci-token:$CI_JOB_TOKEN@$CI_SERVER_HOST/<group>/<policy-repository>.git" "$JGATES_POLICY_DIR"
    - jgates ci --policy "$JGATES_POLICY_DIR" --sarif jgates.sarif
  artifacts:
    when: always
    paths:
      - jgates.sarif
